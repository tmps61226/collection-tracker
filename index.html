圖片可能是：蝦皮／賣貨便訂單、LINE 社群喊單（貼文加留言）、日韓商品頁截圖、代購或使用者自己整理的「清單／明細表」。

【品項（最重要）】
1. 若其中有一張是清單或明細表（有品項、數量、外幣金額、台幣金額、合計），品項、數量、金額一律以它為準；商品頁截圖拿來取得商品照片與完整品名。
2. items 每個品項一筆，絕對不要漏掉。name 整理成台灣常用的完整繁體中文（角色、系列、款式、商品類型都要寫），看不清楚不要亂猜；qty 是數量；price 是「單價」。
3. 外幣訂單：currency 填外幣（JPY／KRW／CNY／USD／HKD），price 填外幣單價；若圖上有使用者已換算好的台幣總額，填在 twTotal。台幣訂單 currency 填 TWD。
4. 不要把商品頁上的原價、劃線價、廣告價當成單價，除非那就是實際購買價。同一筆訂單有多個品項就列多筆。看不出來的欄位用空字串或 0。

【商品照片】
box 是該品項商品照片在那張圖裡的位置 [ymin,xmin,ymax,xmax]，0～1000 的相對座標（左上角為原點），img 是它出現在第幾張圖（從 0 開始）。商品頁截圖上最大的商品主圖就是該品項的照片，請依品名或款式把每一頁對應到正確的品項。只框商品照片本身，不要框店家頭像、Logo、按鈕或文字；清單表格或沒有商品照片的圖，不要給 box。

【運費與總額】
ship 填這筆訂單的「運費」（也可能叫運送費、物流費、店到店運費、配送費、國際運費；例如賣貨便畫面「運費 $38」就填 38），單位和 currency 相同，不要把運費算進任何品項的 price。若寫「免運」或運費被「運費折抵／運費券」全額抵掉，ship 填 0；只抵一部分就填實際還要付的運費。total 填圖上最後的「應付總金額／訂單金額／總計／實付金額」（運費含在內、已扣掉折扣的實付數字），看不到就填 0。

【日期】
只讀圖上真的出現的日期，年份用西元四位數 YYYY-MM-DD；手機最上面的狀態列時間（例如 02:22）不是日期，要忽略；不要編造、不要用今天的日期。「訂單成立／下單／付款」的日期填 buyDate；「買家取件成功／已送達／訂單已完成／已收貨」的日期填 recvDate，並且 status 填 have。只看得到取件日期時，buyDate 也填同一天。預計到貨日填 eta。

【喊單模式】
若圖片是 LINE 社群／LINE VOOM 的團購貼文加留言串：貼文有商品照片、系列名稱、價格（例如「指定款150$」）、貼文時間與開單者（seller 填開單者名稱）。留言串裡每個人用「款式名+數量」喊單（如「漢頓 +1」「花小兔 +2」）。請只找暱稱為「${S.nick||'瓜呱'}」的留言，這些才是我的訂單：每則留言一個品項，name 寫成「系列名 款式名 商品類型」，qty 取自「+數字」（沒寫就是 1），price 取自貼文價格，buyDate 用我留言的時間，貼文若寫「預購」status 填 pre。別人的留言一律忽略。找不到我的留言時 items 留空並在 orig 說明原因。

其他欄位：sourceType 從 ${SRC.join('、')} 挑一個；seller 填賣家或代購名稱；category 從 ${S.cats.join('、')} 挑一個（整筆訂單最主要的），沒有就空字串；若各品項屬於不同分類，每個品項的 category 也各自從同一份清單挑一個，沒有就空字串；pay 是付款狀態；orig 填圖上的原文品名。`}
function parseShot(j){
  let t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
  if(!t)throw new Error('Gemini 沒有回傳內容'+(j.promptFeedback&&j.promptFeedback.blockReason?'（被擋：'+j.promptFeedback.blockReason+'）':''));
  let d;try{d=JSON.parse(t)}catch(e){const m=t.match(/[\[{][\s\S]*[\]}]/);if(!m)throw new Error('Gemini 回傳的格式讀不懂');d=JSON.parse(m[0])}
  if(Array.isArray(d)){const o=d.find(x=>x&&typeof x==='object'&&(Array.isArray(x.items)||x.sourceType||x.seller));d=o&&!(d.length>1&&d.every(x=>x&&x.name))?o:{items:d}}
  if(!Array.isArray(d.items)){const alt=d.products||d.item||d['品項']||d['商品'];if(Array.isArray(alt))d.items=alt;else{const sub=Object.values(d).find(v=>v&&typeof v==='object'&&!Array.isArray(v)&&Array.isArray(v.items));if(sub)d=Object.assign({},d,sub);else d.items=[]}}
  d._raw=t;return d;
}
async function callShot(k,parts,schema,on){
  const body={contents:[{parts}],generationConfig:{responseMimeType:'application/json'}};
  if(schema)body.generationConfig.responseSchema=SHOT_SCHEMA();
  return parseShot(await gem(k,body,on,40000));
}

/* cutout cleanup: remove faint haze + stray specks */
function cleanCut(u){return new Promise(res=>{const im=new Image();im.onerror=()=>res(u);im.onload=()=>{try{
  const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0);const d=g.getImageData(0,0,w,h),a=d.data,N=w*h;
  for(let i=0;i<N;i++){if(a[i*4+3]<24)a[i*4+3]=0}
  const lab=new Int32Array(N),sz=[0],st=new Int32Array(N);let n=0;
  for(let i=0;i<N;i++){if(lab[i]||!a[i*4+3])continue;n++;let sp=0,cnt=0;st[sp++]=i;lab[i]=n;
    while(sp){const p=st[--sp];cnt++;const x=p%w,y=(p-x)/w;for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=w)continue;const q=yy*w+xx;if(!lab[q]&&a[q*4+3]){lab[q]=n;st[sp++]=q}}}}sz.push(cnt)}
  const mx=Math.max(0,...sz);for(let i=0;i<N;i++){const l=lab[i];if(l&&sz[l]<mx*.03)a[i*4+3]=0}
  g.putImageData(d,0,0);trimImg(c.toDataURL('image/webp',.9)).then(res)}catch(e){res(u)}};im.src=u})}

    if(!head){const r=await ghj('/contents/README.md','PUT',{message:'init',content:b64('收藏櫃雲端資料')});head=r.commit.sha;base=r.commit.tree.sha;have.add('README.md')}
    else{const c=await ghj('/git/commits/'+head);base=c.tree.sha;const t=await ghj('/git/trees/'+base+'?recursive=1');(t.tree||[]).forEach(x=>have.add(x.path))}
    if(have.has('data.json')&&head!==lsGet('syncSha')&&auto){toast('雲端有較新的資料，請到設定選「上傳」或「下載」處理',6000);return}
    if(have.has('data.json')&&head!==lsGet('syncSha')&&!confirm('雲端的資料比這支手機上次同步的更新（可能在別的裝置改過）。\n繼續上傳會蓋掉雲端那份，確定嗎？\n（想拿雲端的，請按取消，改用「從雲端下載」）')){toast('已取消');return}
    const {json,imgs}=packData();lsSet('dirty','0');const need=Object.keys(imgs).filter(n=>!have.has('img/'+n)),tree=[];let done=0;
    await pool(need,4,async n=>{const r=await ghj('/git/blobs','POST',{content:imgs[n],encoding:'base64'});tree.push({path:'img/'+n,mode:'100644',type:'blob',sha:r.sha});tt('上傳圖片 '+(++done)+'/'+need.length+'…',0)});
    const bl=await ghj('/git/blobs','POST',{content:b64(json),encoding:'base64'});tree.push({path:'data.json',mode:'100644',type:'blob',sha:bl.sha});
    const nt=await ghj('/git/trees','POST',{base_tree:base,tree}),cm=await ghj('/git/commits','POST',{message:'sync '+new Date().toISOString(),tree:nt.sha,parents:[head]});
    await ghj('/git/refs/heads/'+br,'PATCH',{sha:cm.sha});
    lsSet('syncSha',cm.sha);lsSet('lastSync',String(Date.now()));lsSet('lastBackup',String(Date.now()));lsSet('ghBr',br);

  }catch(e){lsSet('dirty','1');toast((auto?'自動同步失敗：':'同步失敗：')+e.message,5000)}finally{syncBusy=false}}
async function restorePrev(){const p=await kvGet('prev');if(!p||!Array.isArray(p.items)){toast('沒有可還原的資料');return}if(!confirm('還原成 '+new Date(p.t).toLocaleString('zh-TW')+' 下載前的資料（'+p.items.length+' 筆）？')) return;items=p.items.map(mig);if(p.settings&&p.settings.cats)S=Object.assign(S,p.settings);save();renderCats();render();drawSet();toast('✓ 已還原')}

/* backup */
const BK_DAYS=7;
function lastBk(){return Math.max(+lsGet('lastBackup')||0,lastSync())}
async function doBackup(){
  const name='collection-backup-'+today()+'.json',blob=new Blob([JSON.stringify({items,settings:S},(k,v)=>k==='o'&&typeof v==='string'&&v.startsWith('data:')?undefined:v)],{type:'application/json'});
  try{const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'收藏櫃備份'});markBk();return true}}catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();markBk();return true}
function markBk(){try{localStorage.setItem('lastBackup',String(Date.now()));localStorage.removeItem('bkSnooze')}catch(e){}renderBk();if(SO.classList.contains('show'))drawSet();toast('✓ 已備份（若是用分享選單，請確認有選「儲存到檔案」）',4500)}
function renderBk(){renderJobs();
  const el=$('bk');if(!el)return;let sn=0;try{sn=+localStorage.getItem('bkSnooze')||0}catch(e){}
  const l=lastBk(),d=l?Math.floor((Date.now()-l)/864e5):999;
  if(!items.length||d<BK_DAYS||Date.now()<sn){el.innerHTML='';return}
  el.innerHTML=`<div class="note"><b>該備份了</b><small>${l?'已 '+d+' 天沒備份。':'還沒備份過。'}你的 ${items.length} 筆資料只存在這支手機，清除瀏覽資料或換手機就會消失。</small><div class="nb"><button class="pri" data-bk="now">立即備份</button><button data-bk="later">之後再說</button></div></div>`}
$('bk').addEventListener('click',e=>{const b=e.target.closest('[data-bk]');if(!b)return;if(b.dataset.bk==='now')doBackup();else{try{localStorage.setItem('bkSnooze',String(Date.now()+2*864e5))}catch(x){}renderBk()}});

/* merge duplicate items */
function dupGroups(o){const m={};o.items.forEach((i,n)=>{const k=[(i.name||'').trim(),+i.price||0,i.cat||'',i.proxy||''].join('|');if(!(i.name||'').trim())return;(m[k]=m[k]||[]).push(n)});return Object.values(m).filter(g=>g.length>1)}
function mergeDups(o){const g=dupGroups(o);if(!g.length)return 0;const drop=new Set();
  g.forEach(idx=>{const a=o.items[idx[0]];idx.slice(1).forEach(n=>{const b=o.items[n];a.qty=(+a.qty||1)+(+b.qty||1);a.sq=sq(a)+sq(b);if(+b.sp)a.sp=(+a.sp||0)+(+b.sp);if(!a.img&&b.img)a.img=b.img;drop.add(n)})});
  o.items=o.items.filter((_,n)=>!drop.has(n));return drop.size}

/* shrink every "NT$" next to numerals (Hoefler old-style figures make caps look big) */
(function(){
  const skip={SCRIPT:1,STYLE:1,INPUT:1,TEXTAREA:1,OPTION:1,SELECT:1,TITLE:1};
  function walk(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;if(!p||skip[p.nodeName]||(p.classList&&(p.classList.contains('cs')||p.classList.contains('nt'))))return NodeFilter.FILTER_REJECT;return /NT\$|US\$|CN¥|¥|₩/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
    const L=[];while(w.nextNode())L.push(w.currentNode);
    L.forEach(n=>{const parts=n.nodeValue.split(/(NT\$|US\$|HK\$|CN¥|¥|₩)/),f=document.createDocumentFragment();parts.forEach((t,i)=>{if(i%2){const e=document.createElement('i');e.className='cs';e.textContent=t;f.appendChild(e)}else if(t)f.appendChild(document.createTextNode(t))});n.parentNode.replaceChild(f,n)})}
  let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;walk(document.body)})}).observe(document.body,{childList:true,subtree:true,characterData:true});
  walk(document.body)})();
