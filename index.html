<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>收藏預購管理</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="收藏櫃"><meta name="theme-color" content="#f3f0e8">
<style>
:root{--bg:#f3f0e8;--card:#fbfaf7;--tx:#2a2622;--mu:#9a938a;--ln:#e7e2d8;--chip:#ebe6da;--tile:#ece8de;--rd:#b05545;--gr:#5f7a4a;--heart:#d98a7a;--mono:ui-monospace,"SF Mono",Menlo,"Courier New",monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1916;--card:#262320;--tx:#f1ede4;--mu:#8f887d;--ln:#35312c;--chip:#302c27;--tile:#2d2924;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .4 0 0 0 0 .33 0 0 0 .09 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");color:var(--tx);font:15px/1.45 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:110px;padding-top:env(safe-area-inset-top,0px)}
.w{max-width:720px;margin:0 auto;padding:10px 14px}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:6px 0 16px}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--card);display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:var(--tx);cursor:pointer;padding:0}
.circ svg{width:20px;height:20px}
.ttl{text-align:center;font:700 26px var(--mono);letter-spacing:.5px}
.dt{text-align:center;font:12px var(--mono);color:var(--mu);margin-top:2px}
.sum{background:var(--card);border-radius:24px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 14px #3a2e1a12;margin-bottom:10px;overflow:hidden}
.sum small{display:block;font:12px var(--mono);color:var(--mu)}
.sum b{font:700 34px var(--mono);line-height:1.1}.sum b i{font:12px var(--mono);font-style:normal;color:var(--mu);margin-left:4px}
.stkrow{display:flex;padding-right:8px;flex:none}
.stkrow img{width:52px;height:52px;object-fit:contain;margin-right:-16px;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 2px 3px #0003)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mini div{background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:0 2px 10px #3a2e1a0d}
.mini span{font-size:11px;color:var(--mu)}.mini b{display:block;font:700 16px var(--mono);margin-top:1px}
input,select,textarea,button{font:inherit;color:var(--tx)}
.sr{width:100%;padding:12px 16px;border-radius:16px;border:0;background:var(--card);margin-bottom:10px;box-shadow:0 2px 10px #3a2e1a0d}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:20px;padding:8px 16px;background:var(--card);font-size:13px;cursor:pointer;box-shadow:0 2px 8px #3a2e1a0d}
.chip.on{background:var(--tx);color:var(--bg)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:12px;color:var(--mu)}
.bar select{background:var(--chip);border:0;border-radius:12px;padding:6px 8px;font-size:12px;max-width:110px}
.bar label{display:flex;gap:3px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;background:var(--card);border-radius:26px;padding:14px;box-shadow:0 2px 14px #3a2e1a12}
.cell{text-align:center;position:relative;cursor:pointer;min-width:0}
.cell .im{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--tile);border-radius:18px;padding:8px;margin-bottom:6px}
.cell img,.row img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 2px 3px #0003)}
.nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{color:var(--mu);font:12px var(--mono)}
.bd{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--mu);margin-left:4px}
.cell .bds{position:absolute;top:5px;left:5px;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:3px}.cell .bd{margin:0}
.bd.pre{background:#e6dff2;color:#7a62a8}.bd.wish{background:#f3edc2;color:#8a7a2a}.bd.sold{background:#e8e4dc;color:#8a8478}.bd.due{background:#f6d9d3;color:#b05545}
.list{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 2px 14px #3a2e1a12}
.row{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--ln);cursor:pointer;align-items:center}
.row:last-child{border:0}
.row .im{width:60px;height:60px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--tile);border-radius:16px;padding:6px}
.row .mt{flex:1;min-width:0}.row small{color:var(--mu);display:block}
.cell:active,.row:active{transform:scale(.97)}
.nav{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:4;pointer-events:none}
.pill{pointer-events:auto;display:flex;gap:4px;background:#26221e;border-radius:32px;padding:6px;box-shadow:0 8px 24px #0004}
.pill button{width:62px;height:48px;border:0;border-radius:26px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.55;color:#fff}
.pill button.on{background:#ffffff26;opacity:1}
.pill svg{width:22px;height:22px}
.plus{pointer-events:auto;width:60px;height:60px;border-radius:50%;border:0;background:#26221e;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px #0004}
.plus svg{width:26px;height:26px}
.sheet{position:fixed;inset:0;background:#0006;display:none;z-index:6;align-items:flex-end}
.sheet.show{display:flex}
.sheet .box{width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet button{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:20px;padding:14px 18px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 10px #3a2e1a0d}
.sheet b{display:block;font-size:16px}.sheet small{color:var(--mu)}
.mo{position:fixed;inset:0;background-color:var(--bg);overflow:auto;display:none;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.mo.show{display:block}
.mh{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));z-index:2}
.mh button{border:0;background:var(--card);border-radius:22px;padding:9px 18px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px #3a2e1a0d}
.mh .sv{background:var(--tx);color:var(--bg)}.mh .dl{color:var(--rd)}
.cd{background:var(--card);border-radius:22px;margin:0 12px 12px;padding:4px 16px;box-shadow:0 2px 12px #3a2e1a0f}
.cd h3{margin:12px 0 2px;font:600 12px var(--mono);color:var(--mu)}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.fr:last-child{border:0}.fr>span:first-child{flex:none}
.fr input,.fr select{border:0;background:transparent;text-align:right;min-width:0;flex:1;width:100%}
.fr textarea{width:100%;border:0;background:transparent;min-height:70px}
.seg{display:flex;background:var(--chip);border-radius:16px;padding:3px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;padding:8px 2px;border-radius:13px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:600}
.hint{color:var(--mu);text-align:right;font:12px var(--mono);padding:2px 0 8px}
.btn{border:0;background:var(--chip);padding:9px 16px;border-radius:18px;cursor:pointer;margin:4px 4px 4px 0}
.btn.pri{background:var(--tx);color:var(--bg)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.th{position:relative;flex:none;width:84px;height:84px;border-radius:16px;background:var(--tile);border:3px solid transparent;cursor:pointer}
.th.cv{border-color:var(--tx)}
.th img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.th i{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#000a;color:#fff;font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center}
.th b{position:absolute;left:4px;bottom:3px;font-size:10px;background:var(--tx);color:var(--bg);border-radius:6px;padding:0 5px}
.it{background:var(--tile);border-radius:16px;padding:10px;margin:8px 0;position:relative}
.it input{border:0;background:var(--card);border-radius:12px;padding:9px 12px;width:100%;margin-bottom:6px}
.it .two{display:flex;gap:6px}.it .two input{margin:0}
.it .x{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--rd);cursor:pointer;font-size:13px}
.ir{display:flex;gap:8px;align-items:center;padding-right:34px;margin-bottom:6px}.ir input{margin:0}
.ith{flex:none;width:56px;height:56px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu);cursor:pointer}.ith img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.sell{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.sell button{width:32px;height:32px;border-radius:50%;border:0;background:var(--card);font-size:18px;cursor:pointer;color:var(--tx)}
.sell b{font:600 14px var(--mono);color:var(--tx);min-width:44px;text-align:center}
.sell input{flex:1;min-width:140px;border:0;background:var(--card);border-radius:12px;padding:8px 12px}
.love [data-h]{font-size:22px;cursor:pointer;color:var(--heart)}
.empty{text-align:center;color:var(--mu);padding:50px 10px;font:13px/1.8 var(--mono)}
.msg{font-size:12px;color:var(--mu);padding:2px 0 8px}
.cr{display:flex;gap:6px;align-items:center;margin:6px 0}.cr input{flex:1;border:0;background:var(--chip);border-radius:12px;padding:9px}
.cr button{border:0;background:transparent;color:var(--rd);cursor:pointer}
</style></head><body>
<div class="w">
  <div class="top"><button class="circ" id="gear" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button><div><div class="ttl">Collection</div><div class="dt" id="dt"></div></div><span class="circ" id="cnt"></span></div>
  <div id="stats"></div>
  <input class="sr" id="q" placeholder="搜尋品名、賣家、備註">
  <div class="chips" id="chips"></div>
  <select id="fs" hidden><option value="all">全部</option><option value="pre">預購中</option><option value="have">已到貨</option><option value="wish">想買</option><option value="sold">已售出</option></select>
  <div class="bar">
    <select id="fc"></select>
    <select id="so"><option value="buy">購買時間</option><option value="eta">預計到貨</option><option value="price">價格高低</option></select>
    <label><input type="checkbox" id="hs">隱藏已售</label><label><input type="checkbox" id="hw">隱藏種草</label>
  </div>
  <div id="main"></div>
</div>
<div class="nav"><div class="pill"><button id="vg" class="on" aria-label="格狀"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button><button id="vl" aria-label="列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button></div><button class="plus" id="add" aria-label="新增"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="sheet" id="sheet"><div class="box"><button data-n="have"><b>已買到了</b><small>門市、日本現場、自己去買的</small></button><button data-n="pre"><b>預購／喊單</b><small>還沒到貨，等收貨</small></button><button data-n="wish"><b>想買</b><small>先記起來，之後再決定</small></button></div></div>
<div class="mo" id="mo"></div><div class="mo" id="so2"></div>

<script>
const SRC=['LINE社群','蝦皮','露天拍賣','FB','團購','噗浪','書店','電商','賣貨便','日本代購','門市／實體店','日本現場','朋友幫買','其他'];
const CUR={TWD:'NT$',JPY:'¥',CNY:'CN¥',KRW:'₩',USD:'US$'},CURN={TWD:'台幣',JPY:'日幣',CNY:'人民幣',KRW:'韓圜',USD:'美金'};
const PAY={unpaid:'未付款',deposit:'已付訂金',paid:'已付款',cod:'貨到付款'},ST={wish:'想買',pre:'預購中',have:'已到貨',sold:'已售出'};
let itT=0,items=[],S={cats:['漢頓','玩具','衣服','隱形眼鏡','化妝品'],rates:{TWD:1,JPY:.21,CNY:4.5,KRW:.023,USD:31}},view='grid',cur=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const fmt=s=>{if(!s)return'';const d=new Date(s+'T00:00');return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};

/* storage */
let dbp;const db=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('collection-tracker',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
const kvGet=async k=>{try{const d=await db();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})}catch(e){return undefined}};
async function save(){try{const d=await db(),t=d.transaction('kv','readwrite'),s=t.objectStore('kv');s.put(items,'items');s.put(S,'settings')}catch(e){console.error(e)}}

/* partial sales: items carry sq (units sold) and sp (TWD revenue) */
function migSold(o){
  if(o.status==='sold'&&!o.items.some(i=>i.sq!==undefined)){
    const cost=o.items.reduce((a,i)=>a+(+i.qty||1)*(+i.price||0),0),rev=+o.soldPrice||0;
    o.items.forEach(i=>{const q=+i.qty||1;i.sq=q;i.sp=rev?Math.round(rev*(cost?q*(+i.price||0)/cost:1/o.items.length)):''});
  }
  return o;
}
/* migrate v1 records */
function mig(o){
  if(Array.isArray(o.items))return migSold(o);
  const n={id:o.id,status:o.status||'have',src:o.platform||'其他',seller:o.seller||'',link:'',cat:o.cat||'',items:[{name:o.name||'',qty:1,price:+o.price||0}],cur:'TWD',ship:+o.ship||0,
    pay:o.mode==='dep'?(o.balPaid?'paid':'deposit'):'paid',deposit:+o.deposit||0,buyDate:o.buyDate||'',start:o.start||'',dur:o.dur||'',unit:o.unit||'month',eta:'',recvDate:o.recvDate||'',love:o.love||3,note:o.note||'',
    imgs:o.img?[{s:o.img,o:o.imgOrig}]:[],cover:0,soldPrice:o.soldPrice||'',soldDate:o.soldDate||''};
  if(o.preorder&&o.start&&o.dur){const e=calcEta(o.start,o.dur,o.unit);if(e)n.eta=e}
  return migSold(n);
}
function newOrder(){return {id:'o'+Date.now(),status:'pre',src:'LINE社群',seller:'',link:'',cat:S.cats[0]||'',items:[{name:'',qty:1,price:''}],cur:'TWD',ship:0,pay:'paid',deposit:0,buyDate:today(),start:today(),dur:'',unit:'month',eta:'',recvDate:'',love:3,note:'',imgs:[],cover:0,soldPrice:'',soldDate:'',pm:'cash',rate:'',fee:'',twPaid:''}}

/* calc */
function calcEta(start,dur,unit){
  const n=+dur;if(!start||!n)return'';const s=new Date(start+'T00:00');
  if(unit==='month')return iso(new Date(s.getFullYear(),s.getMonth()+n,s.getDate()));
  const d=new Date(s);if(unit==='day'){d.setDate(d.getDate()+n);return iso(d)}
  let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w<6)k++}return iso(d);
}
const sub=o=>o.items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
const total=o=>sub(o)+(+o.ship||0);
const paidAmt=o=>o.pay==='paid'?total(o):o.pay==='deposit'?Math.min(+o.deposit||0,total(o)):0;
const bal=o=>total(o)-paidAmt(o);
function effRate(o){
  if(o.cur==='TWD')return 1;
  const t=total(o);if(+o.twPaid>0&&t>0)return o.twPaid/t;
  const r=+o.rate>0?+o.rate:(+S.rates[o.cur]||1);
  return r*(1+(o.pm==='card'?(+o.fee||0)/100:0));
}
const tw=(o,n)=>n*effRate(o);
const money=(o,n)=>(CUR[o.cur]||'')+Math.round(n).toLocaleString();
const sq=i=>Math.max(0,Math.min(+i.sq||0,+i.qty||1));
const units=o=>o.items.reduce((a,i)=>a+(+i.qty||1),0);
const soldUnits=o=>o.items.reduce((a,i)=>a+sq(i),0);
const soldRev=o=>o.items.reduce((a,i)=>a+(sq(i)?(+i.sp||0):0),0);
const unitCost=(o,i)=>tw(o,+i.price||0)+tw(o,+o.ship||0)/(units(o)||1);
const soldCost=o=>o.items.reduce((a,i)=>a+sq(i)*unitCost(o,i),0);
const profitTW=o=>soldRev(o)-soldCost(o);
function derive(o){if(o.status!=='have'&&o.status!=='sold')return;o.status=soldUnits(o)>=units(o)?'sold':'have';if(soldUnits(o)>0&&!o.soldDate)o.soldDate=today()}
const title=o=>{const f=o.items.find(i=>i.name)||o.items[0]||{};return (f.name||'未命名')+(o.items.length>1?` 等${o.items.length}項`:'')};
const cover=o=>o.imgs&&o.imgs[o.cover]?o.imgs[o.cover].s:(o.imgs&&o.imgs[0]?o.imgs[0].s:'');

/* home */
function renderCats(){const v=$('fc').value;$('fc').innerHTML='<option value="all">全部分類</option>'+S.cats.map(c=>`<option>${esc(c)}</option>`).join('');$('fc').value=[...$('fc').options].some(o=>o.value===v)?v:'all'}
function render(){
  const act=items.filter(o=>o.status!=='wish');
  const inv=act.reduce((a,o)=>a+tw(o,paidAmt(o)),0);
  const pend=items.filter(o=>o.status==='pre'||o.status==='have').reduce((a,o)=>a+tw(o,bal(o)),0);
  const rec=items.reduce((a,o)=>a+soldRev(o),0);
  const m=n=>'NT$'+Math.round(n).toLocaleString();
  const ym=today().slice(0,7),mi=items.filter(o=>(o.buyDate||'').startsWith(ym)&&o.status!=='wish');
  const rec5=[];[...items].sort((a,b)=>(b.buyDate||'').localeCompare(a.buyDate||'')).forEach(o=>{o.items.forEach(it=>{if(it.img&&rec5.length<5)rec5.push(it.img.s)});if(o.imgs&&o.imgs[o.cover]&&rec5.length<5&&!o.items.some(i=>i.img))rec5.push(o.imgs[o.cover].s)});
  $('stats').innerHTML=`<div class="sum"><div><small>This Month</small><b>${mi.length}<i>筆訂單</i></b><small>${m(mi.reduce((a,o)=>a+tw(o,total(o)),0))}</small></div><div class="stkrow">${rec5.map(x=>`<img src="${x}" alt="">`).join('')}</div></div>

function shrink(file,max=900){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',.85))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(file)})}

const GM0=['gemini-flash-latest','gemini-3.8-flash','gemini-flash-lite-latest'];
let GMC=null;
async function models(k){
  if(GMC)return GMC;
  let l=[];
  try{
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),8000);
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{signal:ac.signal,headers:{'x-goog-api-key':k}});clearTimeout(t);
    const j=await r.json();
    l=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(m.name)&&!/image|tts|audio|live|embed|robot|computer|exp|thinking/.test(m.name)).map(m=>m.name.replace('models/',''));
    const ver=n=>(n.match(/(\d+(?:\.\d+)?)/)||[0,0])[1]*1;
    l.sort((a,b)=>ver(b)-ver(a)||(/lite/.test(a)?1:0)-(/lite/.test(b)?1:0));
  }catch(e){}
  GMC=[...new Set([...GM0,...l])].slice(0,8);
  return GMC;
}
async function gem(k,body,on,ms){
  ms=ms||15000;
  const GM=await models(k);
  let last;
  for(let r=0;r<2;r++){
    for(const m of GM){
      if(on)on(m);
      let x,j;const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
      try{
        x=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify(body)});
        j=await x.json();
      }catch(e){last=e.name==='AbortError'?new Error('等太久沒回應（'+m+'）'):e;continue}finally{clearTimeout(tm)}
      if(x.ok)return j;
      last=new Error(j.error&&j.error.message||x.status);
      if(/api key|permission|billing|quota exceeded for/i.test(last.message)&&x.status!==404)throw last;
    }
    await new Promise(r=>setTimeout(r,1500));
  }
  throw last;
}
async function testKey(){
  const k=($('gk').value||localStorage.getItem('gk')||'').replace(/[^\x21-\x7e]/g,'');if(!k){setMsg('請先貼上 Gemini API Key');return}
  localStorage.setItem('gk',k);setMsg('測試中…');
  try{await gem(k,{contents:[{parts:[{text:'回覆 OK'}]}]},m=>setMsg('測試中…（'+m+'）'));setMsg('金鑰可以用 ✓（長度 '+k.length+'）')}
  catch(e){setMsg('失敗：'+e.message+(/demand|overload/i.test(e.message)?'。Google 目前很忙，過幾分鐘再試':''))}
}

  const k=(localStorage.getItem('gk')||'').replace(/[^\x21-\x7e]/g,'');if(!k){setMsg('請先貼上 Gemini API Key');return}
  setMsg('辨識中，請稍等…');
  try{
    const prompt=`你是繁體中文訂單辨識器。以下 ${files.length} 張圖片屬於同一筆預購或訂單（可能是LINE社群喊單截圖、商品型錄、蝦皮、賣貨便、日拍等）。請整合成一筆訂單，只回傳 JSON：
{"sourceType":"${SRC.join('|')} 其中之一","seller":"賣家或代購名稱","link":"","buyDate":"YYYY-MM-DD或空字串","currency":"TWD|JPY|CNY|KRW|USD","ship":運費數字,"pay":"unpaid|deposit|paid|cod","deposit":已付訂金數字,"eta":"預計到貨日YYYY-MM-DD或空字串","category":"從這些分類挑一個：${S.cats.join('、')}，沒有就空字串","items":[{"name":"品名","qty":數量,"price":單價數字}],"orig":"圖上的原文品名"}
規則：品名請整理成台灣常用的完整繁體中文，例如「哥吉拉×三麗鷗 漢頓 填充玩偶吊飾」，角色、款式、商品類型都要寫出，看不清楚的不要亂猜。price 只填實際購買的單價，不要填日幣定價、原價或廣告價格。同一筆訂單有多個品項就列多筆。看不出來的欄位用空字串或0。
【喊單模式】若圖片是LINE社群／LINE VOOM的團購貼文加留言串：貼文通常有商品照片、系列名稱、價格（例如「指定款150$」）、貼文時間與開單者（seller 填開單者名稱）。留言串裡每個人用「款式名+數量」喊單（如「漢頓 +1」「花小兔 +2」）。請只找暱稱為「${S.nick||'瓜呱'}」的留言（含頭像相同、同名的多則留言），這些才是我的訂單：每則留言就是一個品項，name 寫成「系列名 款式名 商品類型」（款式名取自留言，系列與商品類型取自貼文照片與文字），qty 取自「+數字」（沒寫就是1），price 取自貼文價格（指定款價格適用於所選款式，不要填別人的）。buyDate 用我留言的時間。別人的留言一律忽略。若貼文寫「預購」，status 填 "pre"。若沒有找到我的留言，items 留空並在 orig 說明原因。
在 JSON 裡多加一個欄位 "status":"pre|wish|have 或空字串"。`;
    const parts=[{text:prompt}];
    const small=[];
    for(const f of files){const u=await shrink(f,1400);if(u){small.push(u);parts.push({inline_data:{mime_type:'image/webp',data:u.split(',')[1]}})}}
    const j=await gem(k,{contents:[{parts}],generationConfig:{responseMimeType:'application/json'}},m=>setMsg('辨識中（'+m+'），最久約 15～30 秒…'),30000);
    const d=JSON.parse(j.candidates[0].content.parts[0].text.replace(/```json|```/g,''));
    if(d.sourceType&&SRC.includes(d.sourceType))cur.src=d.sourceType;
    if(d.seller)cur.seller=d.seller;if(d.link)cur.link=d.link;if(d.buyDate)cur.buyDate=d.buyDate;
    if(CUR[d.currency])cur.cur=d.currency;if(+d.ship)cur.ship=+d.ship;
    if(PAY[d.pay]){cur.pay=d.pay;if(d.pay==='deposit'&&+d.deposit)cur.deposit=+d.deposit}
    if(d.category&&S.cats.includes(d.category))cur.cat=d.category;
    if(Array.isArray(d.items)&&d.items.length)cur.items=d.items.map(i=>({name:i.name||'',qty:+i.qty||1,price:+i.price||''}));
    if(d.eta){cur.eta=d.eta;cur.status='pre'}else if(['pre','wish','have'].includes(d.status))cur.status=d.status;
    if(d.orig&&!(cur.items[0]&&cur.items[0].name===d.orig))cur.note=(cur.note?cur.note+'\n':'')+'原文品名：'+d.orig;
    for(const u of small){if(cur.imgs.length<10)cur.imgs.push({s:u})}
    drawEd();setMsg('已填入，請檢查一下內容再儲存');
  }catch(e){setMsg('辨識失敗：'+(/Load failed|Failed to fetch/.test(e.message)?'連不上 Gemini（網路中斷、金鑰貼錯，或金鑰有多餘的字）。請按「測試金鑰」確認':e.message))}
}
async function doBg(m){
  setMsg2('去背中…第一次要下載模型，請稍等');
  try{
    const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
    const blob=await (await fetch(m.s)).blob();const out=await removeBackground(blob);
    const u=URL.createObjectURL(out),im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);m.o=m.s;m.s=c.toDataURL('image/webp',.9);drawEd()};
    im.src=u;
  }catch(e){setMsg2('去背失敗：'+e.message)}
}

/* settings */
const SO=$('so2');
function drawSet(){
  SO.innerHTML=`<div class="mh"><button id="sx">完成</button><span></span></div>
  <div class="cd"><h3>自訂分類</h3>${S.cats.map((c,i)=>`<div class="cr"><input data-ci="${i}" value="${esc(c)}"><button data-cd="${i}">刪除</button></div>`).join('')}
    <div class="cr"><input id="newcat" placeholder="新增分類名稱"><button id="addcat" style="color:var(--ac)">新增</button></div></div>
  <div class="cd"><h3>我的暱稱（喊單截圖用來找我的留言）</h3><div class="fr"><span>暱稱</span><input id="nick" value="${esc(S.nick||'瓜呱')}" placeholder="例如：瓜呱"></div></div>
  <div class="cd"><h3>匯率（換算成台幣，用於統計）</h3>${['JPY','CNY','KRW','USD'].map(c=>`<div class="fr"><span>1 ${CURN[c]} =</span><input data-rate="${c}" type="number" inputmode="decimal" step="any" value="${S.rates[c]}"></div>`).join('')}</div>
  <div class="cd"><h3>備份</h3><button class="btn" id="ex">匯出備份</button><button class="btn" id="im">匯入備份</button><input type="file" id="imf" accept=".json" hidden>
    <div class="msg">資料只存在這個瀏覽器，建議定期匯出備份。</div></div>`;
}
$('gear').onclick=()=>{drawSet();SO.classList.add('show')};
SO.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ci!==undefined){const i=+t.dataset.ci,old=S.cats[i],v=t.value.trim();if(v&&v!==old){S.cats[i]=v;items.forEach(o=>{if(o.cat===old)o.cat=v});save();renderCats();render()}else t.value=old}
  if(t.id==='nick'){S.nick=t.value.trim()||'瓜呱';save()}
  if(t.dataset.rate){S.rates[t.dataset.rate]=+t.value||S.rates[t.dataset.rate];save();render()}
  if(t.id==='imf'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),its=Array.isArray(d)?d:d.items;if(!Array.isArray(its))throw 0;if(confirm('匯入 '+its.length+' 筆資料，會取代目前的資料，確定嗎？')){items=its.map(mig);if(d.settings&&d.settings.cats)S=Object.assign(S,d.settings);save();renderCats();render();drawSet()}}catch(x){alert('檔案格式不正確')}};r.readAsText(t.files[0])}
});
SO.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='sx'){SO.classList.remove('show');renderCats();render()}
  if(b.dataset.cd!==undefined){if(confirm('刪除這個分類？（已使用的訂單不會被刪除）')){S.cats.splice(+b.dataset.cd,1);save();drawSet()}}
  if(b.id==='addcat'){const v=$('newcat').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();drawSet()}}
  if(b.id==='im')$('imf').click();
  if(b.id==='ex'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({items,settings:S})],{type:'application/json'}));a.download='collection-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}
});

/* home events */
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){$('fs').value=b.dataset.s;render()}});
$('main').addEventListener('click',e=>{const n=e.target.closest('[data-id]');if(n)openEd(n.dataset.id)});
['q','fs','fc','so','hs','hw'].forEach(i=>$(i).addEventListener('input',render));
$('vg').onclick=()=>{view='grid';$('vg').classList.add('on');$('vl').classList.remove('on');render()};
$('vl').onclick=()=>{view='list';$('vl').classList.add('on');$('vg').classList.remove('on');render()};
$('add').onclick=()=>$('sheet').classList.add('show');
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-n]');
  if(!b){if(e.target.id==='sheet')$('sheet').classList.remove('show');return}
  $('sheet').classList.remove('show');
  openEd();
  if(b.dataset.n==='have'){cur.status='have';cur.recvDate=today();cur.src='門市／實體店';cur.pay='paid';drawEd()}
  if(b.dataset.n==='wish'){cur.status='wish';drawEd()}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{const a=await kvGet('items'),s=await kvGet('settings');if(s&&s.cats)S=Object.assign(S,s);items=(a||[]).map(mig);renderCats();render()})();
</script></body></html>
