  const rest=q-k,sNew=sold?(toNew?Math.min(sold,k):Math.max(0,sold-rest)):0,sRest=sold-sNew,per=sold?sp/sold:0;
  const add=[...Array(k)].map((_,j)=>{const n=Object.assign({},keep,mk(j),{qty:1,price:it.price});if(it.got)n.got=it.got;if(j<sNew){n.sq=1;if(sp)n.sp=r2(per)}if(tx)n.tx=r2(tx/q);if(fpa)n.fpa=String(r2(fpa/q));return n});
  const sum=f=>add.reduce((a,n)=>a+(+n[f]||0),0);

  else{it.qty=0;const last=add[add.length-1];if(sp){const lastSold=[...add].reverse().find(n=>n.sq);if(lastSold)lastSold.sp=r2(lastSold.sp+sp-sum('sp'))}if(tx)last.tx=r2(last.tx+tx-sum('tx'));if(fpa)last.fpa=String(r2(+last.fpa+fpa-sum('fpa')))}

  return add}

function onField(ev){

  if(f==='_paid'){const n=parseFloat(e.value);if(n>=0){if(cur._s0===undefined)cur._s0=+cur.ship||0;cur.items.forEach(i=>{if(i.p0===undefined)i.p0=i.price});
      const pr=i=>+i.p0||0,sb=cur.items.reduce((a,i)=>a+(+i.qty||0)*pr(i),0),zi=cur.items.filter(i=>!(pr(i)>0)),zu=zi.reduce((a,i)=>a+(+i.qty||1),0),diff=n-sb-cur._s0;
      cur.items.forEach(i=>{i.price=i.p0});cur.ship=cur._s0;
      if(zu>0&&diff>0){const per=Math.round(diff/zu*10000)/10000;zi.forEach(i=>{i.price=per})}else cur.ship=Math.round((cur._s0+diff)*100)/100;
      cur.even='f';cur.shipBy='p';if(+cur.tot>0)cur.tot=n;
      const q=MO.querySelector('[data-f="ship"]');if(q)q.value=cur.ship;MO.querySelectorAll('[data-i][data-k="price"]').forEach(el=>{const it=cur.items[+el.dataset.i];if(it)el.value=it.price})}upd();return}
  if(f==='_sold'){const n=parseFloat(e.value);if(n>=0){const L=cur.items.filter(i=>sq(i)>0),w=i=>sq(i)*(+i.price>0?+i.price:1),W=L.reduce((a,i)=>a+w(i),0);if(L.length&&W>0){let left=Math.round(n);L.forEach((i,k)=>{const v=k===L.length-1?left:Math.round(n*w(i)/W);i.sp=v;left-=v});MO.querySelectorAll('[data-i][data-k="sp"]').forEach(el=>{const it=cur.items[+el.dataset.i];if(it)el.value=it.sp||''})}}upd();return}
  if(f==='_days'){const n=parseInt(e.value,10);if(n>=0){const d=new Date(today()+'T00:00');d.setDate(d.getDate()+n);const x=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');cur.eta=x;const q=MO.querySelector('[data-f="eta"]');if(q)q.value=x}else{cur.eta='';const q=MO.querySelector('[data-f="eta"]');if(q)q.value=''}upd();return}
  cur[f]=e.value;
  if(f==='eta'){const q=MO.querySelector('[data-f="_days"]');if(q)q.value=e.value?Math.max(0,Math.round((new Date(e.value+'T00:00')-new Date(today()+'T00:00'))/864e5)):''}
  if(f==='start'||f==='dur'||f==='unit'){const x=calcEta(cur.start,cur.dur,cur.unit);if(x){cur.eta=x;const n=MO.querySelector('[data-f="eta"]');if(n)n.value=x}}

  upd();

3. 幣別（很重要）：只要收據、明細表或刷卡單上出現外幣的消費金額（日圓 JPY、韓元 KRW、人民幣 CNY、美金 USD、港幣 HKD），currency 就一定填那個外幣，price 填外幣單價，絕對不要把外幣換算成台幣再填進 price，也不要因為圖上同時有台幣就把 currency 填成 TWD。台幣金額另外填：twTotal 填「實際從信用卡／帳戶扣的台幣總額」（刷卡簡訊、刷卡帳單、換匯水單上的台幣金額）；rate 填圖上看得到的匯率（1 單位外幣＝多少台幣，例如日圓 0.2、韓元 0.023），看不到就填 0，不要自己猜；payMethod 看得到是信用卡刷卡就填 card，現金或換匯填 cash，看不出來填空字串；feeAmt 填圖上明確標示的「海外手續費／國外交易手續費」台幣金額，看不到填 0。台幣訂單 currency 才填 TWD。
4. 不要把商品頁上的原價、劃線價、廣告價當成單價，除非那就是實際購買價。同一筆訂單有多個品項就列多筆。看不出來的欄位用空字串或 0。

【商品照片】
box 是該品項商品照片在那張圖裡的位置 [ymin,xmin,ymax,xmax]，0～1000 的相對座標（左上角為原點），img 是它出現在第幾張圖（從 0 開始）。商品頁截圖上最大的商品主圖就是該品項的照片，請依品名或款式把每一頁對應到正確的品項。只框商品照片本身，不要框店家頭像、Logo、按鈕或文字；清單表格或沒有商品照片的圖，不要給 box。

【運費與總額】
ship 填這筆訂單的「運費」（也可能叫運送費、物流費、店到店運費、配送費、國際運費；例如賣貨便畫面「運費 $38」就填 38），單位和 currency 相同，不要把運費算進任何品項的 price。若寫「免運」或運費被「運費折抵／運費券」全額抵掉，ship 填 0；只抵一部分就填實際還要付的運費。total 填圖上最後的「應付總金額／訂單金額／總計／實付金額」（運費含在內、已扣掉折扣的實付數字），看不到就填 0。

【日期】
只讀圖上真的出現的日期，年份用西元四位數 YYYY-MM-DD；手機最上面的狀態列時間（例如 02:22）不是日期，要忽略；不要編造、不要用今天的日期。「訂單成立／下單／付款」的日期填 buyDate；「買家取件成功／已送達／訂單已完成／已收貨」的日期填 recvDate，並且 status 填 have。只看得到取件日期時，buyDate 也填同一天。預計到貨日填 eta（圖上若寫「預計到手／預計到貨／預計收貨／預計出貨／預計發售」都算，一定要抓）；「建立時間／下單時間／成立時間／購買日期」填 buyDate。

【喊單模式】
若圖片是 LINE 社群／LINE VOOM 的團購貼文加留言串：貼文有商品照片、系列名稱、價格（例如「指定款150$」）、貼文時間與開單者（seller 填開單者名稱）。留言串裡每個人用「款式名+數量」喊單（如「漢頓 +1」「花小兔 +2」）。請只找暱稱為「${S.nick||'瓜呱'}」的留言，這些才是我的訂單：每則留言一個品項，name 寫成「系列名 款式名 商品類型」，qty 取自「+數字」（沒寫就是 1），price 取自貼文價格，buyDate 用我留言的時間，貼文若寫「預購」status 填 pre。別人的留言一律忽略。找不到我的留言時 items 留空並在 orig 說明原因。

其他欄位：sourceType 從 ${SRC.join('、')} 挑一個；seller 填賣家或代購名稱；category 從 ${S.cats.join('、')} 挑一個（整筆訂單最主要的），沒有就空字串；若各品項屬於不同分類，每個品項的 category 也各自從同一份清單挑一個，沒有就空字串；pay 是付款狀態；orig 填圖上的原文品名。`}
function parseShot(j){
  let t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
  if(!t)throw new Error('Gemini 沒有回傳內容'+(j.promptFeedback&&j.promptFeedback.blockReason?'（被擋：'+j.promptFeedback.blockReason+'）':''));
  let d;try{d=JSON.parse(t)}catch(e){const m=t.match(/[\[{][\s\S]*[\]}]/);if(!m)throw new Error('Gemini 回傳的格式讀不懂');d=JSON.parse(m[0])}
  if(Array.isArray(d)){const o=d.find(x=>x&&typeof x==='object'&&(Array.isArray(x.items)||x.sourceType||x.seller));d=o&&!(d.length>1&&d.every(x=>x&&x.name))?o:{items:d}}
  if(!Array.isArray(d.items)){const alt=d.products||d.item||d['品項']||d['商品'];if(Array.isArray(alt))d.items=alt;else{const sub=Object.values(d).find(v=>v&&typeof v==='object'&&!Array.isArray(v)&&Array.isArray(v.items));if(sub)d=Object.assign({},d,sub);else d.items=[]}}
  d._raw=t;return d;
}

function fillZero(o,T){ // 未填價格的品項，平均分掉「實際總額 − 已知價格」的剩餘
  const r0=effRate(o),zi=o.items.filter(i=>!(+i.price>0)),zu=zi.reduce((a,i)=>a+(+i.qty||1),0);
  if(!zu||!(r0>0))return '沒有未填價格的品項';
  const rest=T/r0-sub(o)-(+o.ship||0),av=T/r0-(+o.ship||0);if(av<=0)return '實際總額太小，扣掉運費後沒有金額可分';
  o.tw0=o.twPaid===undefined?'':o.twPaid;o.items.forEach(i=>{if(i.p0===undefined)i.p0=i.price});
  if(rest<=0){ // 已知價格已用完總額：從已填價格的品項照比例拆一份給未填的（每件權重＝已填品項的平均單價）
    const ki=o.items.filter(i=>+i.price>0),ku=ki.reduce((a,i)=>a+(+i.qty||1),0),ks=sub(o),w=ks/ku,f=av/(ks+zu*w);
    ki.forEach(i=>{i.price=Math.round(i.price*f*10000)/10000});zi.forEach(i=>{i.price=Math.round(w*f*10000)/10000});
    o.twPaid=Math.round(T*100)/100;o.feeLater='';o.even='f';o.shipBy='p';return ''}
  const per=Math.round(rest/zu*10000)/10000;zi.forEach(i=>{i.price=per});o.twPaid=Math.round(T*100)/100;o.feeLater='';o.even='f';o.shipBy='p';return ''}
function setEven(o,on){
  if(on){const u=units(o)||1,sb=sub(o);o.items.forEach(i=>{if(i.p0===undefined)i.p0=i.price;i.price=Math.round(sb/u*10000)/10000});o.even='1'}
  else{o.items.forEach(i=>{if(i.p0!==undefined){i.price=i.p0;delete i.p0}});if(o._s0!==undefined){o.ship=o._s0;delete o._s0}o.even='';o.shipBy='p';if(o.tw0!==undefined){o.twPaid=o.tw0;delete o.tw0}}
}

/* shrink every "NT$" next to numerals (Hoefler old-style figures make caps look big) */
(function(){
  const skip={SCRIPT:1,STYLE:1,INPUT:1,TEXTAREA:1,OPTION:1,SELECT:1,TITLE:1};
  function walk(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;if(!p||skip[p.nodeName]||(p.classList&&(p.classList.contains('cs')||p.classList.contains('nt'))))return NodeFilter.FILTER_REJECT;return /NT\$|US\$|CN¥|¥|₩/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
    const L=[];while(w.nextNode())L.push(w.currentNode);
    L.forEach(n=>{const parts=n.nodeValue.split(/(NT\$|US\$|HK\$|CN¥|¥|₩)/),f=document.createDocumentFragment();parts.forEach((t,i)=>{if(i%2){const e=document.createElement('i');e.className='cs';e.textContent=t;f.appendChild(e)}else if(t)f.appendChild(document.createTextNode(t))});n.parentNode.replaceChild(f,n)})}
  let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;walk(document.body)})}).observe(document.body,{childList:true,subtree:true,characterData:true});
  walk(document.body)})();
