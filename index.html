<script>

let fMode=false,flTab='all',itT=0,items=[],S={cats:['漢頓','玩具','衣服','隱形眼鏡','化妝品'],cardFee:1.5,rates:{TWD:1,JPY:.21,CNY:4.5,KRW:.023,USD:31,HKD:4}},view='shelf',cur=null;

/* storage */

const kvGet=async k=>{try{const d=await db();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})}catch(e){return undefined}};

/* 分片儲存：每張訂單單獨存一筆（o:ID），只寫有變動的，避免每次把全部資料（可能數百 MB）一次搬進記憶體而當機 */
const kvTx=(f)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');f(t.objectStore('kv'));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))}));
const fpOf=o=>JSON.stringify(o,(k,v)=>typeof v==='string'&&v.length>400?v.length+'|'+v.slice(0,24)+v.slice(-24):v);
const FP=new Map();let sharded=false,putChain=Promise.resolve();
function uniqIds(){const seen=new Set();items.forEach(o=>{if(!o.id||seen.has(o.id))o.id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);seen.add(o.id)})}
async function putShards(){
  uniqIds();const cur=new Map(items.map(o=>[o.id,fpOf(o)]));
  for(const o of items){if(FP.get(o.id)!==cur.get(o.id)){await kvTx(st=>st.put(o,'o:'+o.id));FP.set(o.id,cur.get(o.id))}}
  const gone=[...FP.keys()].filter(id=>!cur.has(id));
  await kvTx(st=>{st.put(items.map(o=>o.id),'oids');st.put(S,'settings')});
  if(gone.length){await kvTx(st=>gone.forEach(id=>st.delete('o:'+id)));gone.forEach(id=>FP.delete(id))}
  if(!sharded){sharded=true;await kvTx(st=>st.delete('items'))}
}
const idbPut=()=>(putChain=putChain.catch(()=>{}).then(putShards));
async function loadItems(){
  const ids=await kvGet('oids');
  if(Array.isArray(ids)){sharded=true;const out=[];for(const id of ids){const o=await kvGet('o:'+id);if(o){out.push(o);FP.set(o.id,fpOf(o))}}window.LOADMISS=ids.length-out.length;return out}
  return (await kvGet('items'))||[];
}
async function save(){AVC=null;try{localStorage.setItem('dirty','1');localStorage.setItem('lastSave',String(Date.now()))}catch(e){}schedAuto();
  try{await idbPut();saveFail=0}catch(e){console.error(e);try{await new Promise(r=>setTimeout(r,800));await idbPut();saveFail=0}catch(e2){console.error(e2);if(!saveFail++||saveFail%5===0)toast('⚠ 這次沒存進手機！資料只在目前畫面，關掉 app 會消失。請先到設定按「上傳」或「備份」。（'+((e2&&e2.name)||'錯誤')+'）',12000)}}}

/* partial sales: items carry sq (units sold) and sp (TWD revenue) */
function migSold(o){
  if(o.status==='sold'&&!o.items.some(i=>i.sq!==undefined)){
    const cost=o.items.reduce((a,i)=>a+(+i.qty||1)*(+i.price||0),0),rev=+o.soldPrice||0;
    o.items.forEach(i=>{const q=+i.qty||1;i.sq=q;i.sp=rev?Math.round(rev*(cost?q*(+i.price||0)/cost:1/o.items.length)):''});
  }
  return o;
}
/* migrate v1 records */
function mig(o){
  if(Array.isArray(o.items))return migSold(o);
  const n={id:o.id,status:o.status||'have',src:o.platform||'其他',seller:o.seller||'',link:'',cat:o.cat||'',items:[{name:o.name||'',qty:1,price:+o.price||0}],cur:'TWD',ship:+o.ship||0,
    pay:o.mode==='dep'?(o.balPaid?'paid':'deposit'):'paid',deposit:+o.deposit||0,buyDate:o.buyDate||'',start:o.start||'',dur:o.dur||'',unit:o.unit||'month',eta:'',recvDate:o.recvDate||'',love:o.love||3,note:o.note||'',
    imgs:o.img?[{s:o.img,o:o.imgOrig}]:[],cover:0,soldPrice:o.soldPrice||'',soldDate:o.soldDate||''};
  if(o.preorder&&o.start&&o.dur){const e=calcEta(o.start,o.dur,o.unit);if(e)n.eta=e}
  return migSold(n);
}
function newOrder(){return {id:'o'+Date.now(),status:'pre',src:'LINE社群',seller:'',link:'',cat:S.cats[0]||'',items:[{name:'',qty:1,price:''}],cur:'TWD',ship:0,pay:'paid',deposit:0,buyDate:today(),start:today(),dur:'',unit:'month',eta:'',recvDate:'',love:3,note:'',imgs:[],cover:0,soldPrice:'',soldDate:'',pm:'cash',rate:'',fee:'',twPaid:''}}

/* calc */
function calcEta(start,dur,unit){
  const n=+dur;if(!start||!n)return'';const s=new Date(start+'T00:00');
  if(unit==='month')return iso(new Date(s.getFullYear(),s.getMonth()+n,s.getDate()));
  const d=new Date(s);if(unit==='day'){d.setDate(d.getDate()+n);return iso(d)}
  let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w<6)k++}return iso(d);
}
const chkWarn=o=>{if(!(+o.tot>0)||(o.cur&&o.cur!=='TWD')||(+o.ship<0))return'';const sm=sub(o),sh=+o.ship||0,df=sm+sh-o.tot;return Math.abs(df)<1?'':`<div class="warn">⚠ 品項加總 ${sm.toLocaleString()} ＋ 運費 ${sh.toLocaleString()} ＝ ${(sm+sh).toLocaleString()}，和圖上總額 ${Math.round(o.tot).toLocaleString()} ${df>0?'多':'少'}了 ${Math.abs(Math.round(df)).toLocaleString()}。可能有折扣，或有品項價格抓錯，請核對。<br><button class="wok" data-wok="1">我確認過了，不用提醒</button></div>`};
const lv=(o,it)=>it&&it.love!=null&&it.love!==''?+it.love:(+o.love||0);
const sub=o=>o.items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
const total=o=>sub(o)+(+o.ship||0);
function fixPaid(){const l=items.filter(o=>(o.status==='have'||o.status==='sold')&&o.pay!=='paid');if(!l.length)return 0;return putPrev().then(()=>{l.forEach(o=>{o.pay='paid';o.deposit=0});save();return l.length})}
const paidAmt=o=>(o.status==='have'||o.status==='sold'||o.pay==='paid')?total(o):o.pay==='deposit'?Math.min(+o.deposit||0,total(o)):0;
const bal=o=>total(o)-paidAmt(o);
const feeOf=o=>(o.fee===''||o.fee==null)?(+S.cardFee||0):(+o.fee||0);
function effRate(o){
  const t=total(o);if(+o.twPaid>0&&t>0){let q=+o.twPaid;if(o.feeLater==='1')q+=(+o.feeAmt>0?+o.feeAmt:q*feeOf(o)/100);return q/t}
  if(o.cur==='TWD')return 1+(o.pm==='card'?feeOf(o)/100:0);

  return r*(1+(o.pm==='card'?feeOf(o)/100:o.pm==='ali'?(+o.fee||0)/100:0));
}
const tw=(o,n)=>n*effRate(o);
const EYE=['<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.7A10 10 0 0112 5.5c6.4 0 10 6.5 10 6.5a17 17 0 01-3.2 4M6.5 7.2C3.7 9 2 12 2 12s3.6 6.5 10 6.5c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 004.2 4.2"/></svg>'];
const HID='＊＊＊';
const ic=(o,it)=>(it&&it.cat)||o.cat||'';
const fnameOf=c=>{const it=fitOf(c);return it?(it.fn||((c.o.src==='朋友幫買'&&c.o.seller)?c.o.seller:'朋友')):'朋友'};
function fTop(){const L=flList(),T=[['all','全部'],['unpaid','未付款'],['paid','已付款'],['notgiven','未交貨'],['given','已交貨']],cnt=k=>L.filter(FLF[k]).length,owe=L.filter(FLF.unpaid).reduce((a,x)=>a+Math.max(0,x.nt-(+x.it.fpa||0)),0),hold=L.filter(x=>x.st==='tohand').length;
  return `<div class="fsm" style="margin:10px 12px"><div><small>還沒收到的錢</small><b>NT$${owe.toLocaleString()}</b></div><div><small>待交給朋友</small><b>${hold} 件</b></div></div><div class="flt" style="margin:0 12px 6px">${T.map(([k,n])=>`<button data-ft="${k}" class="${flTab===k?'on':''}">${n} ${cnt(k)}</button>`).join('')}</div>`}
const fitOf=c=>{const o=c.o;return c.ix>=0?o.items[c.ix]:(o.items.length===1?o.items[0]:null)};
function fchips(c){const it=fitOf(c);if(!it||ip(c.o,it)!=='1')return '';const k=c.o.id+'|'+(c.ix>=0?c.ix:0),fp=fpdOf(c.o,it),pd=fp!=='0',gt=got(c.o,it);
  return `<div class="fch"><i class="fn">${esc(fnameOf(c))}</i>${gt?'':'<i class="fs pre">預購中</i>'}<button data-fq="${k}" class="${pd?'on':'off'}">${fp==='g'?'🎁 送禮':pd?'已付款':'未付款'}</button>${gt?`<button data-fr="${k}" class="${it.giv?'on':'off'}">${it.giv?'已交貨':'未交貨'}</button>`:''}</div>`}
const HB=c=>`<button class="hb" data-hide="${c.o.id}|${c.ix}" aria-label="${c.hid?'取消隱藏':'隱藏'}">${c.hid?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20L20 4"/></svg>'}</button>`;
const pp=(o,n,d=0)=>money(o,n)+(o.cur!=='TWD'||effRate(o)!==1||d>0?`<span class="tw"><i class="nt">NT$</i>${Math.round(tw(o,n-d)).toLocaleString()}</span>`:'');
const cp=c=>c.avgNT!=null&&!c.cu?money(c.o,c.price)+`<span class="tw"><i class="nt">NT$</i>${Math.round(c.avgNT).toLocaleString()}<i style="font-style:normal;font-size:10px;margin-left:2px">均</i></span>`:c.cu?`<span class="tw" style="color:var(--mu)">賣出 NT$${Math.round(c.sp).toLocaleString()}</span>`:pp(c.o,c.price,cTx(c));
const cTx=c=>{const o=c.o;if(c.ix>=0){const it=o.items[c.ix];return txI(o,it)*(c.q/(+it.qty||1))}return txO(o)};
const money=(o,n)=>(CUR[o.cur]||'')+Math.round(n).toLocaleString();
const sq=i=>Math.max(0,Math.min(+i.sq||0,+i.qty||1));
const units=o=>o.items.reduce((a,i)=>a+(+i.qty||1),0);
const soldUnits=o=>o.items.reduce((a,i)=>a+sq(i),0);
const soldRev=o=>o.items.reduce((a,i)=>a+(sq(i)?(+i.sp||0):0),0);
const txI=(o,i)=>{if(o.taxf!=='done')return 0;if(o.items.some(x=>+x.tx>0))return Math.max(0,+i.tx||0);const T=+o.taxT||0,sb=sub(o);return T>0&&sb>0?T*((+i.qty||0)*(+i.price||0))/sb:0};
const txO=o=>o.items.reduce((a,i)=>a+txI(o,i),0);
const BAGRE=/^(.{0,6})?(紙袋|購物袋|塑膠袋|塑膠提袋|手提袋|提袋|袋子|環保購物袋|レジ袋|ショッパー|shoppingbag|paperbag)\s*[x×]?\s*\d*$/i;
const isBag=n=>BAGRE.test(String(n||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase());

function shotPrompt(n){return `你是繁體中文訂單辨識器。以下 ${n} 份內容（圖片、PDF 或文字檔）屬於同一筆預購或訂單，請整合成一筆，依指定格式回傳 JSON。
圖片可能是：蝦皮／賣貨便訂單、LINE 社群喊單（貼文加留言）、日韓商品頁截圖、代購或使用者自己整理的「清單／明細表」。

【品項（最重要）】
1. 若其中有一張是清單或明細表（有品項、數量、外幣金額、台幣金額、合計），品項、數量、金額一律以它為準；商品頁截圖拿來取得商品照片與完整品名。
2. items 每個品項一筆，絕對不要漏掉。name 整理成台灣常用的完整繁體中文（角色、系列、款式、商品類型都要寫），看不清楚不要亂猜；qty 是數量；price 是「單價」。
3. 幣別（很重要）：只要收據、明細表或刷卡單上出現外幣的消費金額（日圓 JPY、韓元 KRW、人民幣 CNY、美金 USD、港幣 HKD），currency 就一定填那個外幣，price 填外幣單價，絕對不要把外幣換算成台幣再填進 price，也不要因為圖上同時有台幣就把 currency 填成 TWD。台幣金額另外填：twTotal 填「實際從信用卡／帳戶扣的台幣總額」（刷卡簡訊、刷卡帳單、換匯水單上的台幣金額）；rate 填圖上看得到的匯率（1 單位外幣＝多少台幣，例如日圓 0.2、韓元 0.023），看不到就填 0，不要自己猜；payMethod 看得到是信用卡刷卡就填 card，現金或換匯填 cash，看不出來填空字串；feeAmt 填圖上明確標示的「海外手續費／國外交易手續費」台幣金額，看不到填 0。台幣訂單 currency 才填 TWD。

【商品照片】
box 是該品項商品照片在那張圖裡的位置 [ymin,xmin,ymax,xmax]，0～1000 的相對座標（左上角為原點），img 是它出現在第幾張圖（從 0 開始）。商品頁截圖上最大的商品主圖就是該品項的照片，請依品名或款式把每一頁對應到正確的品項。只框商品照片本身，不要框店家頭像、Logo、按鈕或文字；清單表格或沒有商品照片的圖，不要給 box。

【運費與總額】
ship 填這筆訂單的「運費」（也可能叫運送費、物流費、店到店運費、配送費、國際運費；例如賣貨便畫面「運費 $38」就填 38），單位和 currency 相同，不要把運費算進任何品項的 price。若寫「免運」或運費被「運費折抵／運費券」全額抵掉，ship 填 0；只抵一部分就填實際還要付的運費。total 填圖上最後的「應付總金額／訂單金額／總計／實付金額」（運費含在內、已扣掉折扣的實付數字），看不到就填 0。

【日期】
只讀圖上真的出現的日期，年份用西元四位數 YYYY-MM-DD；手機最上面的狀態列時間（例如 02:22）不是日期，要忽略；不要編造、不要用今天的日期。「訂單成立／下單／付款」的日期填 buyDate；「買家取件成功／已送達／訂單已完成／已收貨」的日期填 recvDate，並且 status 填 have。只看得到取件日期時，buyDate 也填同一天。預計到貨日填 eta（圖上若寫「預計到手／預計到貨／預計收貨／預計出貨／預計發售」都算，一定要抓）；「建立時間／下單時間／成立時間／購買日期」填 buyDate。

【喊單模式】

其他欄位：sourceType 從 ${SRC.join('、')} 挑一個；seller 填賣家或代購名稱；category 從 ${S.cats.join('、')} 挑一個（整筆訂單最主要的），沒有就空字串；若各品項屬於不同分類，每個品項的 category 也各自從同一份清單挑一個，沒有就空字串；pay 是付款狀態；orig 填圖上的原文品名。`}

async function cmpImgs(){
  const re=async u=>new Promise(res=>{const im=new Image();im.onerror=()=>res(u);im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const o=c.toDataURL('image/webp',.78);res(o.length<u.length?o:u)};im.src=u});
  const holders=[];const walk=x=>{if(Array.isArray(x))x.forEach(walk);else if(x&&typeof x==='object'){for(const k of ['s','o'])if(typeof x[k]==='string'&&x[k].startsWith('data:image')&&x[k].length>40000)holders.push([x,k]);Object.values(x).forEach(v=>{if(v&&typeof v==='object')walk(v)})}};walk(items);
  if(!holders.length){toast('圖片都已經夠小了');return}
  const before=holders.reduce((a,[x,k])=>a+x[k].length,0);let i=0;
  for(const [x,k] of holders){x[k]=await re(x[k]);toast('縮小圖片 '+(++i)+'/'+holders.length+'…',0)}

/* shrink every "NT$" next to numerals (Hoefler old-style figures make caps look big) */
(function(){
  const skip={SCRIPT:1,STYLE:1,INPUT:1,TEXTAREA:1,OPTION:1,SELECT:1,TITLE:1};
  function walk(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;if(!p||skip[p.nodeName]||(p.classList&&(p.classList.contains('cs')||p.classList.contains('nt'))))return NodeFilter.FILTER_REJECT;return /NT\$|US\$|CN¥|¥|₩/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
    const L=[];while(w.nextNode())L.push(w.currentNode);
    L.forEach(n=>{const parts=n.nodeValue.split(/(NT\$|US\$|HK\$|CN¥|¥|₩)/),f=document.createDocumentFragment();parts.forEach((t,i)=>{if(i%2){const e=document.createElement('i');e.className='cs';e.textContent=t;f.appendChild(e)}else if(t)f.appendChild(document.createTextNode(t))});n.parentNode.replaceChild(f,n)})}
  let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;walk(document.body)})}).observe(document.body,{childList:true,subtree:true,characterData:true});
  walk(document.body)})();
