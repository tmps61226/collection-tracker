<style>

 background:linear-gradient(135deg,#ffffffc2 0%,#ffffff59 38%,#ffffff33 52%,#ffffff8c 100%);

.th img{width:100%;height:100%;object-fit:contain;border-radius:12px}

</style></head><body>
<div class="w">
  <div class="top"><button class="circ" id="gear" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button><div><div class="ttl">收藏櫃</div><div class="dt" id="dt"></div></div><button class="circ" id="eye" aria-label="隱藏金額"></button></div>

<script>
const SRC=['LINE社群','蝦皮','露天拍賣','FB','團購','噗浪','書店','電商','賣貨便','日本代購','門市／實體店','日本現場','朋友幫買','其他'];
const CUR={TWD:'NT$',JPY:'¥',CNY:'CN¥',KRW:'₩',USD:'US$'},CURN={TWD:'台幣',JPY:'日幣',CNY:'人民幣',KRW:'韓圜',USD:'美金'};
const PAY={unpaid:'未付款',deposit:'已付訂金',paid:'已付款',cod:'貨到付款'},ST={wish:'想買',pre:'預購中',have:'已到貨',sold:'已售出'};
let itT=0,items=[],S={cats:['漢頓','玩具','衣服','隱形眼鏡','化妝品'],cardFee:1.5,rates:{TWD:1,JPY:.21,CNY:4.5,KRW:.023,USD:31}},view='shelf',cur=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const fmt=s=>{if(!s)return'';const d=new Date(s+'T00:00');return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};

/* storage */
let dbp;const db=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('collection-tracker',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
const kvGet=async k=>{try{const d=await db();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})}catch(e){return undefined}};
async function save(){try{const d=await db(),t=d.transaction('kv','readwrite'),s=t.objectStore('kv');s.put(items,'items');s.put(S,'settings')}catch(e){console.error(e)}}

/* partial sales: items carry sq (units sold) and sp (TWD revenue) */
function migSold(o){
  if(o.status==='sold'&&!o.items.some(i=>i.sq!==undefined)){
    const cost=o.items.reduce((a,i)=>a+(+i.qty||1)*(+i.price||0),0),rev=+o.soldPrice||0;
    o.items.forEach(i=>{const q=+i.qty||1;i.sq=q;i.sp=rev?Math.round(rev*(cost?q*(+i.price||0)/cost:1/o.items.length)):''});
  }
  return o;
}
/* migrate v1 records */
function mig(o){
  if(Array.isArray(o.items))return migSold(o);
  const n={id:o.id,status:o.status||'have',src:o.platform||'其他',seller:o.seller||'',link:'',cat:o.cat||'',items:[{name:o.name||'',qty:1,price:+o.price||0}],cur:'TWD',ship:+o.ship||0,

/* calc */
function calcEta(start,dur,unit){
  const n=+dur;if(!start||!n)return'';const s=new Date(start+'T00:00');
  if(unit==='month')return iso(new Date(s.getFullYear(),s.getMonth()+n,s.getDate()));
  const d=new Date(s);if(unit==='day'){d.setDate(d.getDate()+n);return iso(d)}
  let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w<6)k++}return iso(d);
}

const total=o=>sub(o)+(+o.ship||0);

const bal=o=>total(o)-paidAmt(o);
const feeOf=o=>(o.fee===''||o.fee==null)?(+S.cardFee||0):(+o.fee||0);
function effRate(o){
  const t=total(o);if(+o.twPaid>0&&t>0)return o.twPaid/t;
  if(o.cur==='TWD')return 1+(o.pm==='card'?feeOf(o)/100:0);
  const r=+o.rate>0?+o.rate:(+S.rates[o.cur]||1);
  return r*(1+(o.pm==='card'?feeOf(o)/100:0));
}

async function gem(k,body,on,ms){
  ms=ms||15000;
  const GM=await models(k),dead=new Set();
  let last;
  for(let r=0;r<2;r++){
    for(const m of GM){
      if(dead.has(m))continue;
      if(on)on(m);
      let x,j;const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
      try{
        x=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify(body)});
        j=await x.json();

      if(x.ok)return j;

      if(!(isQuota(msg)&&last&&!isQuota(last.message)))last=new Error(msg);
      if(/api key not valid|permission denied|billing/i.test(msg)&&!isQuota(msg))throw last;

function shotPrompt(n){return `你是繁體中文訂單辨識器。以下 ${n} 張圖片屬於同一筆預購或訂單，請整合成一筆，依指定格式回傳 JSON。

【品項（最重要）】
1. 若其中有一張是清單或明細表（有品項、數量、外幣金額、台幣金額、合計），品項、數量、金額一律以它為準；商品頁截圖拿來取得商品照片與完整品名。
2. items 每個品項一筆，絕對不要漏掉。name 整理成台灣常用的完整繁體中文（角色、系列、款式、商品類型都要寫），看不清楚不要亂猜；qty 是數量；price 是「單價」。
3. 外幣訂單：currency 填外幣（JPY／KRW／CNY／USD），price 填外幣單價；若圖上有使用者已換算好的台幣總額，填在 twTotal。台幣訂單 currency 填 TWD。
4. 不要把商品頁上的原價、劃線價、廣告價當成單價，除非那就是實際購買價。同一筆訂單有多個品項就列多筆。看不出來的欄位用空字串或 0。

【商品照片】
box 是該品項商品照片在那張圖裡的位置 [ymin,xmin,ymax,xmax]，0～1000 的相對座標（左上角為原點），img 是它出現在第幾張圖（從 0 開始）。商品頁截圖上最大的商品主圖就是該品項的照片，請依品名或款式把每一頁對應到正確的品項。只框商品照片本身，不要框店家頭像、Logo、按鈕或文字；清單表格或沒有商品照片的圖，不要給 box。

【日期】
只讀圖上真的出現的日期，年份用西元四位數 YYYY-MM-DD；手機最上面的狀態列時間（例如 02:22）不是日期，要忽略；不要編造、不要用今天的日期。「訂單成立／下單／付款」的日期填 buyDate；「買家取件成功／已送達／訂單已完成／已收貨」的日期填 recvDate，並且 status 填 have。只看得到取件日期時，buyDate 也填同一天。預計到貨日填 eta。

【喊單模式】

其他欄位：sourceType 從 ${SRC.join('、')} 挑一個；seller 填賣家或代購名稱；category 從 ${S.cats.join('、')} 挑一個（整筆訂單最主要的），沒有就空字串；若各品項屬於不同分類，每個品項的 category 也各自從同一份清單挑一個，沒有就空字串；pay 是付款狀態；orig 填圖上的原文品名。`}
function parseShot(j){
  let t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
  if(!t)throw new Error('Gemini 沒有回傳內容'+(j.promptFeedback&&j.promptFeedback.blockReason?'（被擋：'+j.promptFeedback.blockReason+'）':''));
  let d;try{d=JSON.parse(t)}catch(e){const m=t.match(/[\[{][\s\S]*[\]}]/);if(!m)throw new Error('Gemini 回傳的格式讀不懂');d=JSON.parse(m[0])}
  if(Array.isArray(d)){const o=d.find(x=>x&&typeof x==='object'&&(Array.isArray(x.items)||x.sourceType||x.seller));d=o&&!(d.length>1&&d.every(x=>x&&x.name))?o:{items:d}}
  if(!Array.isArray(d.items)){const alt=d.products||d.item||d['品項']||d['商品'];if(Array.isArray(alt))d.items=alt;else{const sub=Object.values(d).find(v=>v&&typeof v==='object'&&!Array.isArray(v)&&Array.isArray(v.items));if(sub)d=Object.assign({},d,sub);else d.items=[]}}
  d._raw=t;return d;
}
async function callShot(k,parts,schema,on){
  const body={contents:[{parts}],generationConfig:{responseMimeType:'application/json'}};
  if(schema)body.generationConfig.responseSchema=SHOT_SCHEMA();
  return parseShot(await gem(k,body,on,40000));
}
async function doShot(files){
  const k=(localStorage.getItem('gk')||'').replace(/[^\x21-\x7e]/g,'');if(!k){setMsg('請先貼上 Gemini API Key');return}
  setMsg('辨識中，請稍等…');
  try{
    const small=[],imgParts=[];
    for(const f of files){const u=await shrink(f,1400);if(u){small.push(u);imgParts.push({inline_data:{mime_type:'image/webp',data:u.split(',')[1]}})}}
    const on=m=>setMsg('辨識中（'+m+'），最久約 15～40 秒…');
    const parts=[{text:shotPrompt(files.length)},...imgParts];
    let d;
    try{d=await callShot(k,parts,true,on)}
    catch(e){if(/schema|INVALID_ARGUMENT|Invalid JSON payload|response_schema/i.test(e.message)&&!isQuota(e.message))d=await callShot(k,parts,false,on);else throw e}
    if(!d.items.some(i=>i&&i.name)){
      setMsg('第一次沒抓到品項，再試一次…');
      const p2=[{text:'請只做一件事：把這些圖片中這筆訂單的所有品項列出來（品名用繁體中文、數量、單價）。若有清單或明細表，以它為準，一個品項都不要漏。'+shotPrompt(files.length)},...imgParts];
      try{const d2=await callShot(k,p2,true,on);if(d2.items.some(i=>i&&i.name))d=Object.assign({},d,{items:d2.items,currency:d.currency||d2.currency,twTotal:d.twTotal||d2.twTotal})}catch(e2){if(isQuota(e2.message))throw e2}
    }
    if(d.sourceType&&SRC.includes(d.sourceType))cur.src=d.sourceType;
    if(d.seller)cur.seller=d.seller;if(d.link)cur.link=d.link;if(/^\d{4}-\d{2}-\d{2}$/.test(d.buyDate||''))cur.buyDate=d.buyDate;
    if(CUR[d.currency])cur.cur=d.currency;if(+d.ship)cur.ship=+d.ship;
    if(PAY[d.pay]){cur.pay=d.pay;if(d.pay==='deposit'&&+d.deposit)cur.deposit=+d.deposit}
    if(d.category&&S.cats.includes(d.category))cur.cat=d.category;
    const good=d.items.filter(i=>i&&(i.name||+i.price));
    if(good.length)cur.items=good.map(i=>{const o={name:String(i.name||''),qty:+i.qty||1,price:+i.price||''};if(i.category&&S.cats.includes(i.category)&&i.category!==cur.cat)o.cat=i.category;return o});
    if(cur.cur!=='TWD'&&+d.twTotal>0&&good.length)cur.twPaid=+d.twTotal;
    if(d.eta){cur.eta=d.eta;cur.status='pre'}else if(['pre','wish','have'].includes(d.status))cur.status=d.status;
    if(/^\d{4}-\d{2}-\d{2}$/.test(d.recvDate||'')){cur.recvDate=d.recvDate;if(!d.eta)cur.status='have'}
    if(/^\d{4}-\d{2}-\d{2}$/.test(d.recvDate||'')&&!/^\d{4}-\d{2}-\d{2}$/.test(d.buyDate||''))cur.buyDate=d.recvDate;
    if(cur.status==='have'&&!cur.recvDate)cur.recvDate=today();
    if(d.orig&&!(cur.items[0]&&cur.items[0].name===d.orig))cur.note=(cur.note?cur.note+'\n':'')+'原文品名：'+d.orig;
    let nc=0;
    if(good.length)for(let q=0;q<good.length&&q<cur.items.length;q++){const it=good[q];let bx=it.box;if(bx&&!Array.isArray(bx)&&typeof bx==='object')bx=[bx.ymin,bx.xmin,bx.ymax,bx.xmax];if(typeof bx==='string')bx=bx.match(/-?\d+(?:\.\d+)?/g);if(Array.isArray(bx)&&bx.length===4){bx=bx.map(Number);let u=await cropImg(files[+it.img||0]||files[0],bx);if(u)u=await trimImg(u);if(u){cur.items[q].img={s:u};if(!nc){cur.imgs.unshift({s:u});cur.cover=0}nc++}}}
    for(const u of small){if(cur.imgs.length<10)cur.imgs.push({s:u})}
    drawEd();
    if(!good.length)setMsg('沒辨識出品項（Gemini 回傳：'+d._raw.slice(0,90).replace(/\s+/g,' ')+'…）。請手動填，或換更清楚的截圖再試。');
    else setMsg('已填入 '+good.length+' 個品項'+(nc?'，自動截取 '+nc+' 張商品圖':'，沒偵測到商品圖，可點縮圖手動加圖')+'；原截圖已保留，請檢查一下再儲存');
  }catch(e){setMsg('辨識失敗：'+nice(e))}
}
async function doBg(m){
  if(bgBusy){toast('還在處理上一張，請稍等');drawEd();return}
  bgBusy=true;toast('✂️ 去背中…第一次要下載模型，約 10～30 秒，請不要離開',0);
  try{
    const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
    const blob=await (await fetch(m.s)).blob();const out=await removeBackground(blob);
    const u=URL.createObjectURL(out),im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);m.o=m.s;trimImg(c.toDataURL('image/webp',.9)).then(t=>{m.s=t;bgBusy=false;drawEd();toast('✓ 去背完成（想復原可按「還原原圖」）',3200)})};
    im.onerror=()=>{bgBusy=false;drawEd();toast('去背失敗：圖片讀取錯誤',4000)};
    im.src=u;
  }catch(e){bgBusy=false;drawEd();toast('去背失敗：'+(/fetch|network|Load failed|import/i.test(e.message)?'下載去背模型失敗，請確認網路':e.message),4500)}
}

/* settings */
const SO=$('so2');
function drawSet(){
  SO.innerHTML=`<div class="mh"><button id="sx">完成</button><span></span></div>
  <div class="cd"><h3>自訂分類</h3>${S.cats.map((c,i)=>`<div class="cr"><input data-ci="${i}" value="${esc(c)}"><button data-cd="${i}">刪除</button></div>`).join('')}
    <div class="cr"><input id="newcat" placeholder="新增分類名稱"><button id="addcat" style="color:var(--ac)">新增</button></div></div>
  <div class="cd"><h3>收藏櫃不顯示的分類</h3>${S.cats.map((c,i)=>`<div class="fr"><span>${esc(c)}</span><input data-hid="${esc(c)}" type="checkbox" ${(S.hid||[]).includes(c)?'checked':''} style="flex:none;width:auto"></div>`).join('')}<div class="msg">勾選的分類平常不會出現在收藏櫃和統計裡；在上面「全部分類」直接選那個分類，還是看得到。</div></div>
  <div class="cd"><h3>我的暱稱（喊單截圖用來找我的留言）</h3><div class="fr"><span>暱稱</span><input id="nick" value="${esc(S.nick||'瓜呱')}" placeholder="例如：瓜呱"></div></div>
  <div class="cd"><h3>隱藏總投入</h3><div class="fr"><span>首頁不顯示「總投入」金額</span><input id="hideamt" type="checkbox" ${S.hide?'checked':''} style="flex:none;width:auto"></div><div class="msg">開啟後，總投入、價格、總額、淨賺都顯示 ＊＊＊。輸入價格時還是看得到自己打的數字。首頁右上角的眼睛也可以隨時切換。</div></div>
  <div class="cd"><h3>刷卡</h3><div class="fr"><span>國外手續費 %（刷卡自動加上）</span><input id="cardfee" type="number" inputmode="decimal" step="any" value="${+S.cardFee||0}"></div></div>
  <div class="cd"><h3>匯率（換算成台幣，用於統計）</h3>${['JPY','CNY','KRW','USD'].map(c=>`<div class="fr"><span>1 ${CURN[c]} =</span><input data-rate="${c}" type="number" inputmode="decimal" step="any" value="${S.rates[c]}"></div>`).join('')}</div>
  <div class="cd"><h3>備份</h3><button class="btn" id="ex">匯出備份</button><button class="btn" id="im">匯入備份</button><input type="file" id="imf" accept=".json" hidden>
    <div class="msg">資料只存在這個瀏覽器，建議定期匯出備份。</div></div>`;
}
$('eye').onclick=()=>{S.hide=!S.hide;save();render()};
$('gear').onclick=()=>{drawSet();SO.classList.add('show')};
SO.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ci!==undefined){const i=+t.dataset.ci,old=S.cats[i],v=t.value.trim();if(v&&v!==old){S.cats[i]=v;S.hid=(S.hid||[]).map(x=>x===old?v:x);items.forEach(o=>{if(o.cat===old)o.cat=v;o.items.forEach(i=>{if(i.cat===old)i.cat=v})});save();renderCats();render()}else t.value=old}
  if(t.dataset.hid!==undefined){const c=t.dataset.hid;S.hid=(S.hid||[]).filter(x=>x!==c);if(t.checked)S.hid.push(c);save();render()}
  if(t.id==='hideamt'){S.hide=t.checked;save();render()}
  if(t.id==='cardfee'){S.cardFee=+t.value||0;save();render()}
  if(t.id==='nick'){S.nick=t.value.trim()||'瓜呱';save()}
  if(t.dataset.rate){S.rates[t.dataset.rate]=+t.value||S.rates[t.dataset.rate];save();render()}
  if(t.id==='imf'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),its=Array.isArray(d)?d:d.items;if(!Array.isArray(its))throw 0;if(confirm('匯入 '+its.length+' 筆資料，會取代目前的資料，確定嗎？')){items=its.map(mig);if(d.settings&&d.settings.cats)S=Object.assign(S,d.settings);save();renderCats();render();drawSet()}}catch(x){alert('檔案格式不正確')}};r.readAsText(t.files[0])}
});
SO.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='sx'){SO.classList.remove('show');renderCats();render()}
  if(b.dataset.cd!==undefined){if(confirm('刪除這個分類？（已使用的訂單不會被刪除）')){S.cats.splice(+b.dataset.cd,1);save();drawSet()}}
  if(b.id==='addcat'){const v=$('newcat').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();drawSet()}}
  if(b.id==='im')$('imf').click();
  if(b.id==='ex'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({items,settings:S})],{type:'application/json'}));a.download='collection-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}
});

/* home events */
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){$('fs').value=b.dataset.s;render()}});
$('main').addEventListener('click',e=>{const hb=e.target.closest('[data-hide]');if(hb){e.stopPropagation();const [id,ix]=hb.dataset.hide.split('|'),o=items.find(x=>x.id===id);if(o){const its=+ix>=0?[o.items[+ix]]:o.items,v=!its.every(i=>i.hide);its.forEach(i=>{if(v)i.hide=true;else delete i.hide});save();render();toast(v?'已隱藏，勾選「顯示已隱藏」可找回':'已取消隱藏')}return}
  if(e.target.closest('[data-add]')){$('sheet').classList.add('show');return}const n=e.target.closest('[data-id]');if(n)openEd(n.dataset.id)});
['q','fs','fc','so','hs','hw','hp','hh'].forEach(i=>$(i).addEventListener('input',render));
$('hp').addEventListener('input',()=>{try{localStorage.setItem('hp2',$('hp').value)}catch(e){}});
$('fc').addEventListener('input',()=>setFc($('fc').value));
const VB={grid:'vg',list:'vl',shelf:'vs'};
function setView(v){view=v;try{localStorage.setItem('view',v)}catch(e){}Object.entries(VB).forEach(([k,id])=>$(id).classList.toggle('on',k===v));render()}
$('vg').onclick=()=>setView('grid');$('vl').onclick=()=>setView('list');$('vs').onclick=()=>setView('shelf');
$('add').onclick=()=>$('sheet').classList.add('show');
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-n]');
  if(!b){if(e.target.id==='sheet')$('sheet').classList.remove('show');return}
  $('sheet').classList.remove('show');
  openEd();
  if(b.dataset.n==='have'){cur.status='have';cur.recvDate=today();cur.src='門市／實體店';cur.pay='paid';drawEd()}
  if(b.dataset.n==='wish'){cur.status='wish';drawEd()}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function autoTrimAll(){
  let ch=false;
  for(const o of items){
    for(const it of o.items||[])if(it.img&&!it.img.z){const t=await trimImg(it.img.s);it.img.z=1;ch=true;if(t!==it.img.s)it.img.s=t}
    for(const m of o.imgs||[])if(m.o&&!m.z){const t=await trimImg(m.s);m.z=1;ch=true;if(t!==m.s)m.s=t}
  }
  if(ch){save();render()}
}
(async()=>{const a=await kvGet('items'),s=await kvGet('settings');if(s&&s.cats)S=Object.assign(S,s);items=(a||[]).map(mig);renderCats();try{const f=localStorage.getItem('fcSel');if(f&&[...$('fc').options].some(o=>o.value===f))$('fc').value=f}catch(e){}try{const h=localStorage.getItem('hp2')||(localStorage.getItem('hp')==='0'?'all':'hide');$('hp').value=h}catch(e){}
try{const v=localStorage.getItem('view');if(VB[v])view=v;Object.entries(VB).forEach(([k,id])=>$(id).classList.toggle('on',k===view))}catch(e){}render();setTimeout(()=>autoTrimAll().catch(()=>{}),400)})();
</script></body></html>
