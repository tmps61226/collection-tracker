<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>收藏預購管理</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="收藏櫃"><meta name="theme-color" content="#3b82f6">
<style>
:root{--bg:#f1f1f6;--card:#fff;--tx:#1c1c1e;--mu:#8a8a8e;--ac:#3b82f6;--ln:#e5e5ea;--rd:#ef4444;--gr:#16a34a;--chip:#eaeaf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111114;--card:#1d1d22;--tx:#f2f2f5;--mu:#9a9aa2;--ln:#2e2e35;--chip:#2a2a31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111114;--card:#1d1d22;--tx:#f2f2f5;--mu:#9a9aa2;--ln:#2e2e35;--chip:#2a2a31;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:90px}
.w{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.st{background:var(--card);border-radius:14px;padding:10px 12px}
.st b{display:block;font-size:18px}.st span{font-size:12px;color:var(--mu)}
input,select,textarea,button{font:inherit;color:var(--tx)}
.sr{width:100%;padding:10px 12px;border-radius:12px;border:0;background:var(--chip);margin-bottom:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px}
.bar select{background:var(--chip);border:0;border-radius:8px;padding:6px}
.bar label{display:flex;gap:4px;align-items:center}
.sp{flex:1}
.ib{background:var(--chip);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.ib.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border-radius:20px;padding:10px}
.cell{text-align:center;position:relative;cursor:pointer;min-width:0}
.cell .im{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:40px}
.cell img,.row img{width:100%;height:100%;object-fit:contain}
.nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{color:var(--ac);font-weight:700;font-size:13px}
.bd{position:absolute;top:2px;left:2px;font-size:11px;padding:2px 6px;border-radius:8px;background:var(--chip);color:var(--mu)}
.bd.pre{background:#dbeafe;color:#2563eb}.bd.wish{background:#fce7f3;color:#db2777}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--ln);cursor:pointer;align-items:center}
.row .im{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px}
.row .mt{flex:1;min-width:0}.row small{color:var(--mu);display:block}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 16px #0004;cursor:pointer}
.mo{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;z-index:5;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.mo.show{display:block}
.mh{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;padding:12px;z-index:2;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.mh button{border:0;background:var(--card);border-radius:20px;padding:8px 16px;font-weight:700;cursor:pointer}
.mh .sv{color:var(--ac)}.mh .dl{color:var(--rd)}
.cd{background:var(--card);border-radius:18px;margin:0 12px 12px;padding:4px 14px}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln)}
.fr:last-child{border:0}
.fr>span:first-child{flex:none}
.fr input,.fr select{border:0;background:transparent;text-align:right;min-width:0;flex:1;width:100%}
.fr textarea{width:100%;border:0;background:transparent;min-height:70px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;padding:7px 2px;border-radius:8px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--card);font-weight:700}
.hint{color:var(--ac);text-align:right;font-size:13px;padding:2px 0 8px}
.imgbox{display:flex;gap:12px;align-items:center;padding:12px 0}
.imgbox .pv{width:96px;height:96px;background:var(--chip);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:36px}
.imgbox .pv img{width:100%;height:100%;object-fit:contain}
.love span{font-size:22px;cursor:pointer;color:#f472b6}
.sw{width:50px;height:30px;accent-color:var(--gr)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.btn{border:0;background:var(--chip);padding:8px 14px;border-radius:10px;cursor:pointer;margin:4px 4px 4px 0}
</style></head>
<body>
<div class="w">
  <h1>🧸 收藏櫃 <span id="cnt" style="font-size:14px;color:var(--mu)"></span></h1>
  <div class="stats" id="stats"></div>
  <input class="sr" id="q" placeholder="搜尋名稱">
  <div class="bar">
    <select id="fs"><option value="all">全部</option><option value="pre">預購中</option><option value="have">已到貨</option><option value="wish">想買</option><option value="sold">已出手</option></select>
    <select id="so"><option value="buy">購買時間</option><option value="eta">預計出貨日</option><option value="price">價格高低</option></select>
    <label><input type="checkbox" id="hs">隱藏已出</label>
    <label><input type="checkbox" id="hw">隱藏種草</label>
    <span class="sp"></span>
    <button class="ib on" id="vg">▦</button><button class="ib" id="vl">☰</button>
  </div>
  <div id="main"></div>
  <p style="text-align:center;margin-top:20px">
    <button class="btn" id="ex">匯出備份</button><button class="btn" id="im">匯入備份</button>
    <input type="file" id="imf" accept=".json" hidden>
  </p>
  <p class="empty" style="padding:0;font-size:12px">資料只存在這台裝置的瀏覽器裡，建議定期匯出備份。</p>
</div>
<button class="fab" id="add">＋</button>
<div class="mo" id="mo"></div>

<script>
const ST={wish:'想買',pre:'待收貨',have:'已到貨',sold:'已出手'};
let items=[],view='grid',cur=null;
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const fmt=s=>{if(!s)return'';const d=new Date(s+'T00:00');return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};
const money=n=>'$'+(Math.round(n||0)).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* IndexedDB: one record holds all items */
let dbp;
function db(){return dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('collection-tracker',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
async function load(){try{const d=await db();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('items');q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}catch(e){return[]}}
async function save(){try{const d=await db();d.transaction('kv','readwrite').objectStore('kv').put(items,'items')}catch(e){console.error(e)}}

/* eta calculation */
function eta(it){
  if(!it.preorder||!it.start||!it.dur)return null;
  const s=new Date(it.start+'T00:00'),n=+it.dur;
  if(it.unit==='month'){return new Date(s.getFullYear(),s.getMonth()+n,s.getDate())}
  if(it.unit==='day'){const d=new Date(s);d.setDate(d.getDate()+n);return d}
  const d=new Date(s);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w<6)k++}return d;
}
const total=it=>(+it.price||0)+(+it.ship||0);
const paid=it=>it.mode==='dep'?(+it.deposit||0)+(it.balPaid?(+it.balance||0):0)+(+it.ship||0):total(it);
const profit=it=>(+it.soldPrice||0)-total(it);

function render(){
  const act=items.filter(i=>i.status!=='wish');
  const inv=act.reduce((a,i)=>a+paid(i),0);
  const pend=act.filter(i=>i.status==='pre'&&i.mode==='dep'&&!i.balPaid).reduce((a,i)=>a+(+i.balance||0),0);
  const pc=items.filter(i=>i.status==='pre').length;
  const rec=items.filter(i=>i.status==='sold').reduce((a,i)=>a+(+i.soldPrice||0),0);
  $('stats').innerHTML=[['總投入金額',money(inv)],['待付尾款',money(pend)],['預購中',pc+' 件'],['已出售回血',money(rec)]].map(x=>`<div class="st"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  const q=$('q').value.trim().toLowerCase(),fs=$('fs').value,so=$('so').value;
  let l=items.filter(i=>(!q||(i.name||'').toLowerCase().includes(q))&&(fs==='all'||i.status===fs)&&!($('hs').checked&&i.status==='sold')&&!($('hw').checked&&i.status==='wish'));
  l.sort((a,b)=>so==='price'?total(b)-total(a):so==='eta'?((eta(a)||1e15)-(eta(b)||1e15)):(b.buyDate||'').localeCompare(a.buyDate||''));
  $('cnt').textContent='('+l.length+')';
  if(!l.length){$('main').innerHTML='<div class="empty">還沒有商品，按右下角 ＋ 新增</div>';return}
  const im=i=>i.img?`<img src="${i.img}" alt="">`:'🧸';
  const bd=i=>i.status==='have'?'':`<span class="bd ${i.status}">${ST[i.status]}</span>`;
  $('main').innerHTML=view==='grid'
   ?`<div class="grid">${l.map(i=>`<div class="cell" data-id="${i.id}">${bd(i)}<div class="im">${im(i)}</div><div class="nm">${esc(i.name)||'未命名'}</div><div class="pr">${money(total(i))}</div></div>`).join('')}</div>`
   :`<div class="list">${l.map(i=>{const e=eta(i);return `<div class="row" data-id="${i.id}"><div class="im">${im(i)}</div><div class="mt"><div class="nm">${esc(i.name)||'未命名'} ${bd(i)}</div><small>${esc(i.platform||'')} ${esc(i.seller||'')} · ${fmt(i.buyDate)}</small>${e&&i.status==='pre'?`<small>預計 ${fmt(iso(e))}</small>`:''}</div><div class="pr">${money(total(i))}</div></div>`}).join('')}</div>`;
}

/* editor */
function openEd(id){
  cur=id?JSON.parse(JSON.stringify(items.find(i=>i.id===id))):{id:'i'+Date.now(),status:'pre',preorder:true,mode:'full',unit:'month',dur:3,love:3,buyDate:iso(today()),start:iso(today()),price:'',ship:0,deposit:0,balance:0,balPaid:false};
  cur._new=!id;drawEd();$('mo').classList.add('show');$('mo').scrollTop=0;
}
function seg(key,opts){return `<div class="seg">${opts.map(o=>`<button data-k="${key}" data-v="${o[0]}" class="${cur[key]===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`}
function fr(label,key,type='text',ph=''){return `<div class="fr"><span>${label}</span><input data-f="${key}" type="${type}" value="${esc(cur[key])}" placeholder="${ph}" ${type==='number'?'inputmode="decimal"':''}></div>`}
function drawEd(){
  const e=eta(cur),t=today();
  let hint='';
  if(e){const w=Math.max(0,Math.round((t-new Date(cur.start+'T00:00'))/864e5)),r=Math.round((e-t)/864e5);hint=`預計出貨日期 ${fmt(iso(e))}　已等待 ${w} 天，${r>=0?'剩餘 '+r+' 天':'已逾期 '+(-r)+' 天'}`}
  const hearts=[1,2,3,4,5].map(n=>`<span data-h="${n}">${n<=cur.love?'♥':'♡'}</span>`).join('');
  $('mo').innerHTML=`
  <div class="mh"><button id="cx">取消</button><span>${cur._new?`<button class="sv" id="sv">儲存</button>`:`<button class="dl" id="dl">移除</button> <button class="sv" id="sv">儲存</button>`}</span></div>
  <div class="cd"><div class="fr"><span>Gemini API Key</span><input id="gk" type="password" placeholder="貼上免費金鑰" value="${esc(localStorage.getItem('gk')||'')}"></div>
    <div style="padding:8px 0"><button class="btn" id="shot">📷 上傳訂單截圖自動填表</button><input type="file" id="shotf" accept="image/*" hidden><div id="msg" style="font-size:12px;color:var(--mu)"></div></div></div>
  <div class="cd"><div class="imgbox"><div class="pv">${cur.img?`<img src="${cur.img}">`:'🧸'}</div>
    <div><button class="btn" id="pick">上傳商品圖</button>${cur.img?(cur.imgOrig?'<button class="btn" id="undo">還原原圖</button>':'<button class="btn" id="bg">✂️ 自動去背</button>')+'<button class="btn" id="rmimg">移除圖片</button>':''}<input type="file" id="imgf" accept="image/*" hidden>
    <div style="font-size:12px;color:var(--mu)">建議使用已去背的 PNG／WebP，展示櫃會更整齊</div></div></div></div>
  <div class="cd">${seg('status',[['wish','想買'],['pre','預購中'],['have','已到貨'],['sold','已出手']])}
    ${fr('名稱','name','text','商品名稱')}${fr('分類','cat','text','吊飾、娃娃、公仔…')}${fr('尺寸','size','text','')}
    <div class="fr love"><span>喜愛程度</span><span>${hearts}</span></div></div>
  <div class="cd">${fr('購買日期','buyDate','date')}${fr('購買平台','platform','text','Line 社群、蝦皮…')}${fr('賣家名稱','seller','text','')}</div>
  <div class="cd"><div class="fr"><span>預訂商品</span><input type="checkbox" class="sw" data-c="preorder" ${cur.preorder?'checked':''} style="flex:none;width:50px"></div>
   ${cur.preorder?`${fr('工期開始日期','start','date')}${fr('工期多久','dur','number','')}${seg('unit',[['month','月'],['day','自然日'],['work','工作日']])}<div class="hint">${hint}</div>`:''}</div>
  <div class="cd">${seg('mode',[['full','全額'],['dep','訂金＋尾款']])}
   ${cur.mode==='full'?fr('價格','price','number','0'):`${fr('訂金','deposit','number','0')}${fr('尾款','balance','number','0')}${seg('balPaid',[[false,'尾款待付'],[true,'尾款已付']])}`}
   ${fr('運費','ship','number','0')}
   ${cur.mode==='dep'?'':`<div class="fr"><span>需要補運費</span><input type="checkbox" class="sw" data-c="needShip" ${cur.needShip?'checked':''} style="flex:none;width:50px"></div>`}
   <div class="fr"><span>總價</span><b>${money(total(cur))}</b></div></div>
  ${cur.status==='sold'?`<div class="cd">${fr('售出價格','soldPrice','number','0')}${fr('出售日期','soldDate','date')}<div class="fr"><span>淨賺／虧損</span><b style="color:${profit(cur)>=0?'var(--gr)':'var(--rd)'}">${profit(cur)>=0?'+':''}${money(profit(cur))}</b></div></div>`:''}
  <div class="cd">${fr('收貨日期','recvDate','date')}</div>
  <div class="cd"><div class="fr"><textarea data-f="note" placeholder="備註（可選）">${esc(cur.note)}</textarea></div></div>`;
}
/* In dep mode, price = deposit+balance so totals stay consistent */
function sync(){if(cur.mode==='dep')cur.price=(+cur.deposit||0)+(+cur.balance||0)}

$('mo').addEventListener('input',ev=>{const f=ev.target.dataset.f;if(!f)return;cur[f]=ev.target.value;sync();
  if(['dur','start','price','ship','deposit','balance','soldPrice'].includes(f)){const pos=f;const sc=$('mo').scrollTop;const cp=ev.target.selectionStart;drawEd();$('mo').scrollTop=sc;const n=$('mo').querySelector(`[data-f="${pos}"]`);if(n){n.focus();try{n.setSelectionRange(cp,cp)}catch(e){}}}});
$('mo').addEventListener('change',ev=>{const c=ev.target.dataset.c;if(c){cur[c]=ev.target.checked;drawEd()}
  if(ev.target.id==='imgf'&&ev.target.files[0])readImg(ev.target.files[0]);
  if(ev.target.id==='shotf'&&ev.target.files[0])doShot(ev.target.files[0]);
  if(ev.target.id==='gk')localStorage.setItem('gk',ev.target.value.trim())});
$('mo').addEventListener('click',ev=>{
  const b=ev.target.closest('button'),h=ev.target.closest('[data-h]'),id=b&&b.id;
  if(h){cur.love=+h.dataset.h;drawEd();return}
  if(!b)return;
  if(b.dataset.k){let v=b.dataset.v;if(v==='true')v=true;if(v==='false')v=false;cur[b.dataset.k]=v;if(b.dataset.k==='status'){if(v==='pre')cur.preorder=true;if(v==='have'&&!cur.recvDate)cur.recvDate=iso(today());if(v==='sold'&&!cur.soldDate)cur.soldDate=iso(today())}sync();drawEd();return}
  if(id==='cx')$('mo').classList.remove('show');
  if(id==='pick')$('imgf').click();
  if(id==='shot')$('shotf').click();
  if(id==='bg')doBg();
  if(id==='undo'){cur.img=cur.imgOrig;delete cur.imgOrig;drawEd()}
  if(id==='rmimg'){cur.img='';drawEd()}
  if(id==='sv'){sync();delete cur._new;const i=items.findIndex(x=>x.id===cur.id);i<0?items.unshift(cur):items[i]=cur;save();render();$('mo').classList.remove('show')}
  if(id==='dl'&&confirm('確定要移除這個商品？')){items=items.filter(x=>x.id!==cur.id);save();render();$('mo').classList.remove('show')}
});
function readImg(file){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cur.img=c.toDataURL('image/webp',.85);drawEd()};im.src=r.result};r.readAsDataURL(file);
}

/* list + toolbar */
$('main').addEventListener('click',e=>{const n=e.target.closest('[data-id]');if(n)openEd(n.dataset.id)});
['q','fs','so','hs','hw'].forEach(i=>$(i).addEventListener('input',render));
$('vg').onclick=()=>{view='grid';$('vg').classList.add('on');$('vl').classList.remove('on');render()};
$('vl').onclick=()=>{view='list';$('vl').classList.add('on');$('vg').classList.remove('on');render()};
$('add').onclick=()=>openEd();

/* backup */
$('ex').onclick=()=>{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(items));a.download='collection-backup-'+iso(today())+'.json';a.click();
  setTimeout(()=>{if(!document.hidden)alert('若沒有跳出下載，這個預覽頁可能不允許下載；請把網頁用瀏覽器直接開啟，或自行部署後再匯出。')},800)};
$('im').onclick=()=>$('imf').click();
$('imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm('匯入 '+d.length+' 筆資料，會取代目前的資料，確定嗎？')){items=d;save();render()}}catch(x){alert('檔案格式不正確')}};r.readAsText(f)};

function setMsg(t){const m=$('msg');if(m)m.textContent=t}
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
async function doShot(file){
  const k=($('gk')&&$('gk').value||localStorage.getItem('gk')||'').trim();
  if(!k){setMsg('請先貼上 Gemini API Key');return}
  localStorage.setItem('gk',k);setMsg('辨識中…');
  try{
    const prompt='這是一張預購或訂單截圖。請只回傳 JSON：{"name":商品名稱,"price":商品金額數字,"ship":運費數字,"buyDate":"YYYY-MM-DD","platform":購買平台,"seller":賣家名稱,"eta":"預計到貨日 YYYY-MM-DD 或空字串"}。看不出來的欄位用空字串，金額只留數字。';
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:file.type||'image/png',data:await b64(file)}}]}],generationConfig:{responseMimeType:'application/json'}})});
    const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
    const d=JSON.parse(j.candidates[0].content.parts[0].text.replace(/```json|```/g,''));
    ['name','platform','seller','buyDate'].forEach(x=>{if(d[x])cur[x]=d[x]});
    if(d.price!==''&&d.price!=null){cur.price=+d.price||cur.price;cur.mode='full'}
    if(d.ship!==''&&d.ship!=null)cur.ship=+d.ship||0;
    if(d.eta&&cur.preorder){const a=new Date(cur.start+'T00:00'),b=new Date(d.eta+'T00:00'),n=Math.round((b-a)/864e5);if(n>0){cur.unit='day';cur.dur=n}}
    drawEd();setMsg('已填入，請檢查一下內容再儲存');
  }catch(e){setMsg('辨識失敗：'+e.message)}
}
async function doBg(){
  setMsg('去背中…第一次要下載模型，請稍等');
  try{
    const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
    const blob=await (await fetch(cur.img)).blob();
    const out=await removeBackground(blob);
    const u=URL.createObjectURL(out),im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);cur.imgOrig=cur.img;cur.img=c.toDataURL('image/webp',.9);drawEd()};
    im.src=u;
  }catch(e){setMsg('去背失敗：'+e.message)}
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load().then(d=>{items=d;render()});
</script>
